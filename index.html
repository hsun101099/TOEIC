<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Day 單字 · Part 5｜多益每日訓練</title>
<style>
:root{
  color-scheme:light only;
  --canvas:#FAF6F0; --card:#FFFCF8; --ink:#332E28; --muted:#7C7168; --faint:#A79C90;
  --line:#EDE4D8; --accent:#3F6B55; --accent-soft:#E7F0EA; --good:#4A7A5F; --good-soft:#E6F1E9;
  --warn:#9A6318; --warn-soft:#F9EFDF; --r:16px;
  --shadow:0 1px 2px rgba(94,74,52,.05), 0 8px 24px rgba(94,74,52,.07);
  --shadow-lift:0 2px 4px rgba(94,74,52,.06), 0 16px 40px rgba(94,74,52,.13);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
  font-size:16.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:44px 24px 140px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px}
h1{font-size:clamp(29px,5vw,42px);line-height:1.18;letter-spacing:-.03em;font-weight:700;margin:16px 0 8px}
.sub{color:var(--muted);font-size:16px;max-width:62ch}
.nav{display:flex;align-items:center;gap:8px;margin-top:22px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:11px;font:inherit;font-size:13.5px;
  font-weight:550;padding:8px 14px;cursor:pointer;color:var(--ink);transition:all .22s var(--ease)}
.nav button:hover:not(:disabled){border-color:#DFD2C0;box-shadow:var(--shadow);transform:translateY(-1px)}
.nav button:disabled{opacity:.4;cursor:default}
.nav select{border:1px solid var(--line);background:var(--card);border-radius:11px;font:inherit;font-size:13.5px;
  font-weight:550;padding:8px 12px;color:var(--ink);cursor:pointer}
.today{font-size:12.5px;color:var(--faint);margin-left:4px}
.metrics{display:flex;gap:26px;margin-top:24px;flex-wrap:wrap;align-items:center}
.metric b{display:block;font-size:21px;font-weight:650;letter-spacing:-.02em}
.metric span{font-size:12.5px;color:var(--faint)}
.ring{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--accent);transition:stroke-dasharray .5s var(--ease)}
.ringwrap{position:relative;display:grid;place-items:center}
.ringwrap span{position:absolute;font-size:12px;font-weight:650}
.spine{margin:34px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 24px;box-shadow:var(--shadow)}
.spine-title{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.stages{display:flex;align-items:flex-start;margin-top:16px}
.stage{flex:1;position:relative;padding-right:12px}
.stage::before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:var(--line)}
.stage:last-child::before{right:calc(100% - 14px)}
.dot{position:relative;width:14px;height:14px;border-radius:50%;background:var(--card);
  border:2px solid var(--faint);z-index:1;transition:all .35s var(--ease)}
.stage.on .dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.stage h3{font-size:14.5px;font-weight:650;margin:12px 0 2px;letter-spacing:-.01em}
.stage p{font-size:12.5px;color:var(--muted);line-height:1.45}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:30px 0 18px;position:sticky;top:0;z-index:20;
  padding:14px 0;background:linear-gradient(var(--canvas) 72%,rgba(250,246,240,0))}
.seg{display:flex;background:#F1E8DB;border-radius:12px;padding:4px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font:inherit;
  font-size:13.5px;font-weight:550;padding:7px 14px;border-radius:9px;transition:all .22s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(94,74,52,.12)}
.ghost{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:11px;font:inherit;
  font-size:13.5px;font-weight:550;padding:8px 15px;cursor:pointer;color:var(--ink);transition:all .22s var(--ease)}
.ghost:hover{border-color:#DFD2C0;box-shadow:var(--shadow);transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;transition:box-shadow .3s var(--ease),transform .3s var(--ease),border-color .3s var(--ease);
  animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.card.known{border-color:#C6D9CB} .card.known .head b{color:var(--good)}
.head{width:100%;text-align:left;border:0;background:transparent;font:inherit;cursor:pointer;padding:20px 22px;
  display:flex;gap:12px;align-items:flex-start}
.head b{font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.head .zh{font-size:13.5px;color:var(--muted);margin-top:3px}
.pos{font-size:11px;font-weight:650;color:var(--accent);background:var(--accent-soft);padding:3px 8px;
  border-radius:6px;flex:none;margin-top:4px}
.rev{font-size:10.5px;font-weight:650;color:var(--warn);background:var(--warn-soft);padding:3px 7px;
  border-radius:6px;flex:none;margin-top:4px}
.chev{margin-left:auto;flex:none;color:var(--faint);transition:transform .3s var(--ease)}
.card.open .chev{transform:rotate(180deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease)}
.card.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden}
.inner{padding:0 22px 22px;border-top:1px solid var(--line);margin-top:2px;padding-top:18px}
.sent{font-size:16px;line-height:1.75}
mark{background:linear-gradient(transparent 56%, #F6E1B8 56%);color:inherit;padding:0 1px;font-weight:600}
.sent-zh{font-size:14px;color:var(--muted);margin-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:12.5px;color:#5E5349;background:#F4ECE1;border-radius:7px;padding:4px 9px}
.tip{margin-top:14px;background:var(--warn-soft);border-radius:11px;padding:11px 13px;font-size:13px;
  color:#6E4A16;line-height:1.55}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{border:1px solid var(--line);background:var(--card);border-radius:10px;font:inherit;font-size:12.5px;
  font-weight:550;padding:7px 12px;cursor:pointer;color:var(--muted);transition:all .2s var(--ease)}
.acts button:hover{color:var(--ink);border-color:#DFD2C0}
.acts button.mark[data-on="1"]{background:var(--good-soft);border-color:#BCD6C4;color:var(--good)}
.launch{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:40;background:var(--accent);
  color:#FFFCF8;border:0;border-radius:14px;font:inherit;font-size:14.5px;font-weight:600;padding:14px 26px;
  cursor:pointer;box-shadow:0 8px 26px rgba(63,107,85,.30);transition:all .25s var(--ease)}
.launch:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 12px 34px rgba(63,107,85,.36)}
.overlay{position:fixed;inset:0;background:rgba(250,246,240,.88);backdrop-filter:blur(14px);z-index:50;
  display:none;place-items:center;padding:20px;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.overlay.on{display:grid}
.quiz{width:100%;max-width:620px;background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow-lift);padding:30px}
.qtop{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--faint);font-weight:550}
.track{flex:1;height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s var(--ease)}
.qsent{font-size:19px;line-height:1.7;margin:24px 0 6px}
.blank{display:inline-block;min-width:110px;border-bottom:2px solid var(--accent)}
.qhint{font-size:13px;color:var(--muted)}
.opts{display:grid;gap:9px;margin-top:20px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);
  background:var(--card);border-radius:13px;font:inherit;font-size:15px;padding:14px 16px;cursor:pointer;
  transition:all .2s var(--ease)}
.opt:hover:not(:disabled){border-color:#BFD4C6;background:#FDFAF5;transform:translateX(2px)}
.opt kbd{font:inherit;font-size:11.5px;font-weight:650;color:var(--faint);background:#F2E9DD;border-radius:6px;
  padding:2px 7px;flex:none}
.opt.right{border-color:#A6C9B2;background:var(--good-soft)}
.opt.wrong{border-color:#E0BCA6;background:#FAEDE2}
.opt:disabled{cursor:default}
.feedback{margin-top:18px;border-radius:13px;padding:15px 16px;background:#F7F0E6;font-size:13.5px;
  line-height:1.6;display:none}
.feedback.on{display:block;animation:rise .3s var(--ease)}
.feedback .zh{color:var(--muted);margin-top:5px}
.qfoot{display:flex;gap:10px;margin-top:20px;align-items:center}
.primary{border:0;background:var(--accent);color:#FFFCF8;border-radius:12px;font:inherit;font-size:14px;
  font-weight:600;padding:12px 22px;cursor:pointer;transition:all .22s var(--ease)}
.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.link{border:0;background:none;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;padding:8px}
.link:hover{color:var(--ink)}
.score{font-size:52px;font-weight:700;letter-spacing:-.03em}
.wronglist{margin-top:18px;display:grid;gap:8px;max-height:38vh;overflow:auto}
.wrongitem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.wrongitem span{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
.notice{background:var(--warn-soft);border:1px solid #EBD9BC;border-radius:var(--r);padding:16px 18px;
  font-size:14px;color:#6E4A16;margin-top:20px}
/* ---- Part 6 ---- */
.launchbar{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:40;display:flex;gap:10px}
.launchbar button{border:0;border-radius:14px;font:inherit;font-size:14px;font-weight:600;padding:13px 20px;
  cursor:pointer;transition:all .25s var(--ease)}
.launchbar .p5{background:var(--accent);color:#FFFCF8;box-shadow:0 8px 26px rgba(63,107,85,.30)}
.launchbar .p6{background:var(--card);color:var(--ink);border:1px solid var(--line);
  box-shadow:0 8px 26px rgba(94,74,52,.16)}
.launchbar button:hover{transform:translateY(-2px)}
.quiz.wide{max-width:760px}
.passage{background:#FDF9F3;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:18px 0 4px;
  max-height:34vh;overflow:auto}
.pmeta{font-size:12px;color:var(--faint);line-height:1.7;padding-bottom:10px;margin-bottom:12px;
  border-bottom:1px dashed var(--line)}
.ptext{font-size:15.5px;line-height:1.95}
.bl{display:inline-block;min-width:74px;text-align:center;border-bottom:2px solid var(--faint);
  color:var(--faint);font-size:13px;font-weight:650;transition:all .25s var(--ease)}
.bl.cur{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:5px 5px 0 0}
.bl.done{border-color:var(--good);color:var(--good);font-weight:550}
.bl.done.miss{border-color:#C97B4E;color:#B0693F}
.optlong{font-size:14.5px;line-height:1.5;align-items:flex-start}
.optlong kbd{margin-top:2px}
/* ---- Part 7 ---- */
.quiz.reading{max-width:900px}
.docwrap{max-height:36vh;overflow:auto;margin:16px 0 6px;padding-right:4px}
.doc{background:#FDF9F3;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.doc h4{font-size:14.5px;font-weight:650;letter-spacing:-.01em;margin-bottom:4px}
.doc p{font-size:15px;line-height:2;margin-bottom:11px}
.doc p:last-child{margin-bottom:0}
.sn{transition:background .45s var(--ease),box-shadow .45s var(--ease);border-radius:3px}
.sn.ev{background:#F7E2B6;box-shadow:inset 0 -2px 0 #CE9F3C;padding:1px 2px}
.qtext{font-size:16.5px;font-weight:620;line-height:1.6;margin:10px 0 2px;letter-spacing:-.01em}
.evnote{font-size:12.5px;color:var(--warn);margin-top:12px;font-weight:550}
.glosshead{font-size:13px;font-weight:650;margin:22px 0 10px;padding-top:18px;border-top:1px solid var(--line);
  letter-spacing:-.01em}
.glosshead span{font-weight:500;color:var(--faint);font-size:12px}
.gloss{display:grid;gap:8px;max-height:34vh;overflow:auto}
.gitem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#FDFBF7}
.gitem b{font-size:14.5px;font-weight:650}
.gitem i{font-style:normal;font-size:12.5px;color:var(--accent);background:var(--accent-soft);
  border-radius:6px;padding:2px 7px;margin-left:8px}
.gitem span{display:block;color:var(--muted);font-size:12.8px;line-height:1.6;margin-top:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (max-width:600px){
  .wrap{padding:30px 18px 130px}
  .stages{flex-direction:column;gap:16px}
  .stage::before{display:none} .stage{padding-right:0}
  .quiz{padding:22px 20px;border-radius:18px} .qsent{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pagenav{display:flex;gap:4px;background:#F1E8DB;border-radius:12px;padding:4px;margin-bottom:26px;
  width:fit-content;max-width:100%;overflow:auto}
.pagenav a{text-decoration:none;color:var(--muted);font-size:13.5px;font-weight:550;padding:8px 16px;
  border-radius:9px;white-space:nowrap;transition:all .22s var(--ease)}
.pagenav a:hover{color:var(--ink)}
.pagenav a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(94,74,52,.12)}
.mem{margin-top:13px;background:var(--accent-soft);border-radius:11px;padding:11px 13px;
  font-size:13px;color:#2C563F;line-height:1.6}
.mem b{display:block;font-size:11px;letter-spacing:.06em;color:var(--accent);margin-bottom:4px;
  font-weight:700}
.plist{display:grid;gap:14px;margin-top:8px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;
  box-shadow:var(--shadow);cursor:pointer;transition:all .28s var(--ease);animation:rise .45s var(--ease) both}
.pcard:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.pcard h3{font-size:16.5px;font-weight:650;letter-spacing:-.015em}
.pcard .pm{font-size:12.5px;color:var(--faint);margin-top:4px}
.pcard .pv{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.6}
.pcard .tag{display:inline-block;font-size:11.5px;font-weight:650;color:var(--accent);
  background:var(--accent-soft);border-radius:6px;padding:3px 9px;margin-top:12px}
.startbig{border:0;background:var(--accent);color:#FFFCF8;border-radius:13px;font:inherit;font-size:14.5px;
  font-weight:600;padding:13px 24px;cursor:pointer;margin-top:22px;
  box-shadow:0 6px 20px rgba(63,107,85,.24);transition:all .25s var(--ease)}
.startbig:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(63,107,85,.30)}

.dochead{display:flex;justify-content:flex-end;margin:8px 0 -4px}
.dochead button{border:1px solid var(--line);background:var(--card);border-radius:9px;font:inherit;
  font-size:12.5px;font-weight:550;color:var(--muted);padding:5px 11px;cursor:pointer;
  transition:all .2s var(--ease)}
.dochead button:hover{color:var(--ink);border-color:#DFD2C0}
.quiz.docexp .docwrap,.quiz.docexp .passage{max-height:none}

.cd{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;
  box-shadow:var(--shadow);margin-bottom:20px;display:flex;gap:34px;flex-wrap:wrap;align-items:center}
.cd .big{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--accent)}
.cd .lbl{font-size:12.5px;color:var(--faint);margin-top:6px}
.cd .col b{display:block;font-size:21px;font-weight:650;letter-spacing:-.02em}
.bararea{flex:1;min-width:200px}
.bararea .t{height:8px;background:#F1E8DB;border-radius:99px;overflow:hidden}
.bararea .t i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s var(--ease)}
.bararea .cap{font-size:12.5px;color:var(--muted);margin-top:8px}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:26px 0}
.ph{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;
  box-shadow:var(--shadow);transition:all .28s var(--ease)}
.ph:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.ph.now{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--card) 60%)}
.ph h3{font-size:15.5px;font-weight:650;letter-spacing:-.015em}
.ph .rg{font-size:12px;color:var(--faint);margin-top:3px}
.ph p{font-size:13.2px;color:var(--muted);line-height:1.65;margin-top:10px}
.ph .goal{display:inline-block;font-size:12px;font-weight:650;color:var(--accent);
  background:var(--accent-soft);border-radius:7px;padding:4px 10px;margin-top:12px}
.sect{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
  font-weight:650;margin:34px 0 14px}
.wk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;
  box-shadow:var(--shadow);overflow:hidden;transition:all .28s var(--ease)}
.wk.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.wk.done{opacity:.62}
.wkhead{display:flex;align-items:center;gap:13px;padding:17px 20px;cursor:pointer;
  border:0;background:transparent;font:inherit;width:100%;text-align:left}
.wkno{flex:none;width:38px;height:38px;border-radius:11px;background:#F4ECE1;color:var(--muted);
  display:grid;place-items:center;font-size:13px;font-weight:700}
.wk.now .wkno{background:var(--accent);color:#FFFCF8}
.wkhead h3{font-size:15.5px;font-weight:650;letter-spacing:-.015em}
.wkhead .rg{font-size:12px;color:var(--faint);margin-top:2px}
.badge{font-size:11px;font-weight:650;padding:3px 9px;border-radius:6px;flex:none;
  background:var(--warn-soft);color:var(--warn);margin-left:auto}
.badge.now{background:var(--accent-soft);color:var(--accent)}
.wkbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease)}
.wk.open .wkbody{grid-template-rows:1fr}
.wkbody>div{overflow:hidden}
.wkinner{padding:0 20px 20px;border-top:1px solid var(--line);padding-top:16px}
.wkinner .focus{font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:14px}
.task{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:11px;
  cursor:pointer;transition:background .2s var(--ease)}
.task:hover{background:#FAF5EE}
.box{flex:none;width:20px;height:20px;border-radius:6px;border:1.8px solid #D8CCBC;margin-top:2px;
  display:grid;place-items:center;transition:all .2s var(--ease)}
.task.on .box{background:var(--accent);border-color:var(--accent)}
.task.on .box::after{content:"";width:5px;height:9px;border:solid #FFFCF8;border-width:0 2px 2px 0;
  transform:rotate(45deg) translate(-1px,-1px)}
.task span{font-size:14px;line-height:1.6}
.task.on span{color:var(--faint);text-decoration:line-through}
.wkprog{font-size:12px;color:var(--faint);margin-top:10px;padding-left:12px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.ic{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:19px 21px;
  box-shadow:var(--shadow)}

const DAYS = [
{n:1,theme:"一紙合約的誕生",story:"一筆生意從報價到履約的完整流程。照順序讀，你記住的是劇情，不是單字表。",
 arc:[["提案與報價","買方詢價、賣方投標，數字還沒定案。"],["條款協商","雙方對責任與例外來回拉鋸。"],["簽約與履約","白紙黑字生效，違約就要付代價。"]],
 words:[
{s:1,w:"proposal",q:"The committee rejected the first proposal but approved the revised version.",qf:"proposal",qt:"委員會否決了第一份提案，但通過了修訂版。",mem:"pro（向前）+ pose（擺放）＝ 把想法往前擺出來。同族 expose 擺出來、compose 擺在一起。",p:"n.",z:"提案；企劃書",f:"proposal",e:"The marketing team will submit its proposal to the board by Friday.",t:"行銷團隊將在週五前把提案送交董事會。",c:["submit a proposal","a proposal for the project"],k:"動詞 propose → 名詞 proposal，Part 5 最愛考詞性轉換。別和 purpose 看混。"},
{s:1,w:"quotation",q:"We are still waiting for a quotation from the second supplier.",qf:"quotation",qt:"我們仍在等第二家供應商的報價。",mem:"quote 是「引用別人的話」→ 商業上引用一個價格，就是報價。",p:"n.",z:"報價（單）",f:"quotation",e:"Please send us a written quotation for the office furniture.",t:"請將辦公家具的書面報價單寄給我們。",c:["request a quotation","a quotation for + 物品"],k:"口語常縮成 quote。另一個意思是「引文」，看情境判斷。"},
{s:1,w:"estimate",q:"Please provide a written estimate before beginning any repairs.",qf:"estimate",qt:"動工維修前請提供書面估價。",mem:"名詞唸 est-i-mət，尾巴含糊＝只是「估」；動詞唸 est-i-MEIT，尾巴發力＝動手算。",p:"n./v.",z:"估價；估計",f:"estimate",e:"The contractor's estimate exceeded our budget by 15 percent.",t:"承包商的估價超出我們預算 15%。",c:["a rough estimate","cost estimate"],k:"名詞唸 /ˈestɪmət/、動詞唸 /ˈestɪmeɪt/，聽力靠重音分辨。"},
{s:1,w:"bid",q:"The company placed the lowest bid and won the contract.",qf:"bid",qt:"該公司出價最低，因而得標。",mem:"三個字母、三態同形，像喊價一樣短促：bid–bid–bid。看到 bidded 直接刪。",p:"n./v.",z:"投標；出價",f:"bids",e:"Three firms placed bids on the construction project.",t:"三家公司對這項工程投標。",c:["submit a bid","the winning bid"],k:"三態同形 bid–bid–bid，看到 bidded 就是錯選項。"},
{s:1,w:"vendor",q:"Each vendor must complete a security check before entering the site.",qf:"vendor",qt:"每家供應商進場前都必須完成安全查核。",mem:"vend 就是自動販賣機 vending machine 的那個 vend ＝ 賣。加 -or 就是賣的人。",p:"n.",z:"供應商；賣方",f:"vendors",e:"We have shortlisted two vendors for the software upgrade.",t:"我們已為軟體升級篩選出兩家供應商。",c:["approved vendor","vendor selection"],k:"＝ supplier。另有「街頭攤販」之意，圖片題出現過。"},
{s:1,w:"specification",q:"The prototype did not match the specifications we submitted.",qf:"specifications",qt:"原型與我們提交的規格不符。",mem:"specify（指明）→ 把每一項都指明白＝規格書。它的小名叫 spec。",p:"n.",z:"規格；明細",f:"specifications",e:"All materials must meet the specifications listed in Appendix B.",t:"所有材料都必須符合附錄 B 所列規格。",c:["meet the specifications","technical specs"],k:"常縮寫成 spec；動詞是 specify。"},
{s:1,w:"competitive",q:"Few firms can offer such competitive terms on bulk orders.",qf:"competitive",qt:"很少有公司能對大量訂單提供如此優惠的條件。",mem:"-itive 表「帶有…性質」＝ 帶競爭性的。competent 的 -ent 像 excellent，講的是人很行。",p:"adj.",z:"有競爭力的",f:"competitive",e:"Their pricing is highly competitive compared with other suppliers.",t:"與其他供應商相比，他們的定價非常有競爭力。",c:["competitive pricing","a competitive salary"],k:"三兄弟必分清：competitive／competent（能勝任）／competitor（競爭者）。"},
{s:1,w:"submit",q:"All expense claims must be submitted through the online portal.",qf:"submitted",qt:"所有費用申請都必須透過線上系統提交。",mem:"sub（往下）+ mit（送）＝ 往上級那裡送。同族 transmit 傳送、permit 放行。",p:"v.",z:"提交；呈交",f:"submit",e:"Applicants must submit all required documents before the deadline.",t:"申請人必須在截止日前提交所有必要文件。",c:["submit a report","submit A to B"],k:"重音在後，變化雙寫：submitted、submitting。名詞 submission。"},
{s:1,w:"inquiry",q:"Her inquiry was forwarded to the technical support team.",qf:"inquiry",qt:"她的詢問被轉給技術支援團隊。",mem:"in（往裡）+ quire（問）＝ 往裡面問。同族 require 要求、acquire 取得。",p:"n.",z:"詢問；詢價",f:"inquiry",e:"We received an inquiry about bulk discounts from a new client.",t:"我們收到新客戶關於大量採購折扣的詢問。",c:["make an inquiry","an inquiry about + 事"],k:"英式拼法 enquiry。inquire about（詢問）／inquire into（調查）。"},
{s:1,w:"tentative",q:"We have reached a tentative agreement pending legal review.",qf:"tentative",qt:"我們已達成暫定協議，尚待法務審查。",mem:"tent 是帳篷——帳篷是臨時搭的、隨時可拆，所以是暫定的。",p:"adj.",z:"暫定的；初步的",f:"tentative",e:"The tentative delivery date is set for March 10.",t:"暫定的交貨日期訂在 3 月 10 日。",c:["a tentative schedule","tentatively scheduled"],k:"和 confirmed 相對，聽力改期題常靠這字判斷答案。"},
{s:2,w:"negotiate",q:"The union will negotiate with management again next Tuesday.",qf:"negotiate",qt:"工會將於下週二再度與資方協商。",mem:"neg（不）+ oti（閒暇）＝ 沒空閒。古羅馬人做生意就是「不得閒」，於是有了談判。",p:"v.",z:"談判；協商",f:"negotiated",e:"Both parties negotiated the terms for nearly three hours.",t:"雙方就條款協商了將近三小時。",c:["negotiate a contract","negotiate with sb"],k:"名詞 negotiation。徵才廣告 salary negotiable ＝ 薪資面議。"},
{s:2,w:"clause",q:"A new clause was added to protect intellectual property.",qf:"clause",qt:"新增了一項條款以保護智慧財產。",mem:"和 close 同源，一個被封閉起來的獨立單位。文法的「子句」也是 clause。",p:"n.",z:"條款",f:"clause",e:"The confidentiality clause prohibits sharing client data.",t:"保密條款禁止分享客戶資料。",c:["confidentiality clause","termination clause"],k:"別和 cause 看混。一份 contract 由許多 clauses 組成。"},
{s:2,w:"provision",q:"The lease contains a provision allowing early termination.",qf:"provision",qt:"租約中有一項允許提前終止的條款。",mem:"pro（預先）+ vision（看）＝ 預先看到並寫下的規定；預先備妥的物資也是它。",p:"n.",z:"條款；規定",f:"provision",e:"Under this provision, either party may cancel with 30 days' notice.",t:"依據本條規定，任一方均可提前 30 天通知取消。",c:["under the provisions of","make provision for"],k:"一字兩義：法律「規定」＋「提供」。衍生 provided that ＝ 假如。"},
{s:2,w:"amend",q:"The board voted to amend the company's travel policy.",qf:"amend",qt:"董事會投票修訂公司的差旅政策。",mem:"a + mend（修補衣服的那個補）＝ 把文件補一補。",p:"v.",z:"修訂；修正",f:"amended",e:"The agreement was amended to include an extended warranty.",t:"該協議經修訂，納入了延長保固。",c:["amend a contract","an amendment to"],k:"比 change 正式，合約題必考。名詞 amendment。"},
{s:2,w:"waive",q:"The university may waive the application fee for eligible students.",qf:"waive",qt:"校方可為符合資格的學生免除申請費。",mem:"想像用手揮一揮（wave）說「算了不收了」＝ 免除。",p:"v.",z:"放棄（權利）；免除",f:"waive",e:"The bank agreed to waive the transfer fee for premium members.",t:"銀行同意免除高級會員的轉帳手續費。",c:["waive a fee","waive a requirement"],k:"發音同 wave 但意思無關。名詞 waiver ＝ 免責同意書。"},
{s:2,w:"liability",q:"Insurance covers the firm's liability in the event of an accident.",qf:"liability",qt:"保險涵蓋公司在事故發生時的責任。",mem:"字根 lig／li 是「綁」——被綁住的義務。和 obligation 是同一個「綁」。",p:"n.",z:"責任；債務",f:"liability",e:"The clause limits the supplier's liability to the value of the order.",t:"該條款將供應商的責任限制在訂單金額之內。",c:["limit liability","liability for damages"],k:"形容詞 liable：be liable for。財報中與 assets 相對。"},
{s:2,w:"binding",q:"The verbal promise was friendly but not legally binding.",qf:"binding",qt:"那個口頭承諾很友善，但不具法律約束力。",mem:"bind（綁）+ ing ＝ 把雙方綁在一起的。書的裝訂也叫 binding。",p:"adj.",z:"具約束力的",f:"binding",e:"Once signed, the document becomes legally binding on both parties.",t:"一經簽署，該文件即對雙方具法律約束力。",c:["legally binding","a binding agreement"],k:"來自 bind–bound–bound。non-binding ＝ 無約束力。"},
{s:2,w:"concession",q:"A small concession on price finally ended the deadlock.",qf:"concession",qt:"在價格上小幅讓步，最終結束了僵局。",mem:"con（一起）+ cede（退開）＝ 兩邊各退一步。同族 recede 後退、precede 走在前。",p:"n.",z:"讓步；特許經營",f:"concessions",e:"Neither side was willing to make further concessions.",t:"雙方都不願再做出進一步讓步。",c:["make a concession","offer a concession"],k:"動詞 concede。機場 concession stand 指特許商店。"},
{s:2,w:"mutually",q:"The deadline was mutually agreed during Monday's call.",qf:"mutually",qt:"期限是在週一通話中雙方共同議定的。",mem:"拆成 mu-tu-al 唸成「你我都」——兩邊都得動，才叫互相。",p:"adv.",z:"互相地；雙方地",f:"mutually",e:"The two companies reached a mutually beneficial arrangement.",t:"兩家公司達成了互惠的安排。",c:["mutually beneficial","a mutually agreed date"],k:"形容詞 mutual。mutually beneficial 幾乎是合約新聞稿的固定搭配。"},
{s:2,w:"stipulate",q:"Local regulations stipulate that all exits remain unlocked.",qf:"stipulate",qt:"當地法規明訂所有出口不得上鎖。",mem:"古羅馬立約要折斷一根稻稈（stipula）為證，折了就是白紙黑字明訂了。",p:"v.",z:"明訂；規定",f:"stipulates",e:"The contract stipulates that payment be made within 30 days.",t:"合約明訂款項須於 30 天內支付。",c:["stipulate that ...","as stipulated in"],k:"陷阱：後接 that 子句用原形動詞（be made，不是 is made）。"},
{s:3,w:"execute",q:"The lease will be executed once both signatures are obtained.",qf:"executed",qt:"租約將在取得雙方簽名後簽署生效。",mem:"ex（出）+ secut（跟隨）＝ 執行到底；合約簽下去，效力才「跟著」出來。",p:"v.",z:"簽署使生效；執行",f:"executed",e:"The agreement was executed by both parties on May 1.",t:"該協議由雙方於 5 月 1 日簽署生效。",c:["execute a contract","execute a plan"],k:"多益考的多半是「簽署生效」而非「執行」。名詞 execution。"},
{s:3,w:"comply",q:"Restaurants that fail to comply may lose their licence.",qf:"comply",qt:"未能遵守規定的餐廳可能被吊銷執照。",mem:"com（一起）+ ply（折疊）＝ 和規定疊在一起。後面永遠黏著 with，少了就錯。",p:"v.",z:"遵守",f:"comply",e:"All employees must comply with the updated safety regulations.",t:"全體員工都必須遵守更新後的安全規範。",c:["comply with（不可省 with）","in compliance with"],k:"名詞 compliance、形容詞 compliant。少了 with 就是錯選項。"},
{s:3,w:"obligation",q:"Signing this form creates no obligation to purchase.",qf:"obligation",qt:"簽署本表格不構成任何購買義務。",mem:"ob + lig（綁）＝ 被綁住的事。和 liability 共用「綁」這個字根。",p:"n.",z:"義務；責任",f:"obligations",e:"The vendor failed to fulfill its contractual obligations.",t:"該供應商未能履行合約義務。",c:["fulfill an obligation","under no obligation to"],k:"動詞 oblige、形容詞 obligatory。廣告常見 with no obligation。"},
{s:3,w:"terminate",q:"The service was terminated after three missed payments.",qf:"terminated",qt:"該服務在三次未繳款後被終止。",mem:"terminal 是航廈、終點站——走到 terminal 就結束了。",p:"v.",z:"終止",f:"terminate",e:"Either party may terminate the agreement with written notice.",t:"任一方均可以書面通知終止本協議。",c:["terminate a contract","termination clause"],k:"名詞 termination，比 end 正式。"},
{s:3,w:"renewal",q:"A renewal notice is sent thirty days before expiry.",qf:"renewal",qt:"續約通知會在到期前三十天寄出。",mem:"re（再）+ new（新）＝ 再變新一次。",p:"n.",z:"續約；更新",f:"renewal",e:"Your subscription is up for renewal at the end of the month.",t:"您的訂閱將於月底到期續約。",c:["automatic renewal","be up for renewal"],k:"動詞 renew。renewable 另指「可再生的」。"},
{s:3,w:"breach",q:"Sharing the password would breach our security policy.",qf:"breach",qt:"分享密碼將違反我們的安全政策。",mem:"和 break 同源，牆上破了一個口子 → 契約上的破口就是違約。",p:"n./v.",z:"違約；違反",f:"breach",e:"Late delivery constitutes a breach of contract.",t:"延遲交貨構成違約。",c:["a breach of contract","be in breach of"],k:"＝ violation。別把 break 的名詞誤放在這個位置。"},
{s:3,w:"penalty",q:"There is no penalty for cancelling within the first week.",qf:"penalty",qt:"首週內取消不收違約金。",mem:"足球的 PK 就是 penalty kick，犯規要受罰。",p:"n.",z:"罰款；違約金",f:"penalty",e:"A penalty will be imposed for any delay in shipment.",t:"任何出貨延遲都將被處以罰款。",c:["impose a penalty","penalty clause"],k:"動詞 penalize。帳單通知類文章常見 late payment penalty。"},
{s:3,w:"effective",q:"The revised hours are effective from the first of next month.",qf:"effective",qt:"調整後的營業時間自下月一日起生效。",mem:"effect（效力）+ ive ＝ 開始產生效力。efficient 的尾巴通往 efficiency（效率），兩條路。",p:"adj.",z:"生效的；有效的",f:"effective",e:"The new pricing policy is effective as of June 1.",t:"新的定價政策自 6 月 1 日起生效。",c:["effective immediately","effective as of + 日期"],k:"多益考「生效」遠多於「有效果」。effective ≠ efficient（有效率）。"},
{s:3,w:"subject to",q:"All figures are subject to change without prior notice.",qf:"subject to",qt:"所有數字可能未經事先通知即有變動。",mem:"subject 本義是「臣民」——臣服於某件事底下，就是須經、受制於。",p:"phr.",z:"須經…核准；受制於",f:"subject to",e:"All contracts are subject to approval by the legal department.",t:"所有合約均須經法務部門核准。",c:["subject to change","subject to availability"],k:"後接名詞或 V-ing，不接原形動詞。"},
{s:3,w:"in accordance with",q:"Samples were tested in accordance with international standards.",qf:"in accordance with",qt:"樣品依照國際標準進行檢測。",mem:"accord 是「一致」（Honda Accord 那個字）＝ 與規定保持一致。介系詞是 with 不是 to。",p:"phr.",z:"依照；根據",f:"in accordance with",e:"Refunds will be processed in accordance with company policy.",t:"退款將依照公司政策處理。",c:["in accordance with the terms"],k:"不能寫成 in accordance to。較口語的同義說法是 according to。"}
]},

 words:[
{s:1,w:"applicant",q:"Only one applicant had experience in overseas logistics.",qf:"applicant",qt:"只有一位應徵者具備海外物流經驗。",mem:"apply + ant。-ant 結尾多半指人：assistant、consultant、accountant。",p:"n.",z:"應徵者；申請人",f:"applicants",e:"All applicants must complete the online form before Monday.",t:"所有應徵者都須在週一前填妥線上表格。",c:["qualified applicants","applicants for the position"],k:"apply → applicant（人）／application（申請）／appliance（家電），四字常互相干擾。"},
{s:1,w:"candidate",q:"The strongest candidate withdrew for personal reasons.",qf:"candidate",qt:"最有力的人選因個人因素退出。",mem:"古羅馬候選人要穿白袍（candidus ＝ 白）。同族 candle 蠟燭、candid 坦白，都是「白、亮」。",p:"n.",z:"候選人；人選",f:"candidates",e:"Only three candidates were invited for a second interview.",t:"只有三位人選獲邀參加第二次面試。",c:["a strong candidate","shortlisted candidates"],k:"applicant 是「投履歷的人」，candidate 是「進入評選的人」，順序不同。"},
{s:1,w:"credentials",q:"The agency verifies the credentials of every contractor.",qf:"credentials",qt:"該機構會查核每位承包商的資歷。",mem:"cred（相信）→ 讓人願意相信你的文件。同族 credit 信用、incredible 難以置信。",p:"n.",z:"資歷；證明文件",f:"credentials",e:"Please bring your credentials to the interview on Thursday.",t:"請於週四面試時攜帶你的資歷證明。",c:["impressive credentials","verify credentials"],k:"通常用複數。指學歷、證照、推薦信這一整包。"},
{s:1,w:"qualification",q:"He lacks the formal qualifications the role requires.",qf:"qualifications",qt:"他欠缺該職務所需的正式資格。",mem:"quality（品質）→ 證明你品質夠格的東西。",p:"n.",z:"資格；條件",f:"qualifications",e:"The job posting lists three required qualifications.",t:"這則職缺公告列出三項必要資格。",c:["meet the qualifications","required qualifications"],k:"形容詞 qualified（合格的）。be qualified for + 職位。"},
{s:1,w:"recruit",q:"The hospital is struggling to recruit night-shift nurses.",qf:"recruit",qt:"該醫院難以招募夜班護理人員。",mem:"re + cru（成長，如 crescent 新月漸長）＝ 讓組織再長大一點。",p:"v./n.",z:"招募；新進人員",f:"recruit",e:"The firm plans to recruit twenty engineers this quarter.",t:"該公司計畫本季招募二十名工程師。",c:["recruit staff","a new recruit"],k:"名詞 recruitment（招募活動）、recruiter（招募人員）。"},
{s:1,w:"vacancy",q:"Two vacancies remain open in the design department.",qf:"vacancies",qt:"設計部門仍有兩個職缺。",mem:"vacant（空的）→ 空出來的位子。同族 vacuum 真空、vacation 放空。",p:"n.",z:"職缺；空房",f:"vacancy",e:"There is currently one vacancy in the accounting department.",t:"會計部門目前有一個職缺。",c:["fill a vacancy","No Vacancy（客滿）"],k:"一字兩用：職缺＋旅館空房。形容詞 vacant（空的）。"},
{s:1,w:"eligible",q:"Only full-time staff are eligible for the housing allowance.",qf:"eligible",qt:"只有全職員工才有資格領取住房津貼。",mem:"e（出）+ lig（挑選）＝ 可以被挑出來的。和 elect（選舉）同源。",p:"adj.",z:"有資格的",f:"eligible",e:"Employees become eligible for the bonus after one year.",t:"員工任職滿一年後才有資格領取獎金。",c:["eligible for + 名詞","eligible to + 原形"],k:"高頻陷阱：eligible for（後接名詞）vs eligible to（後接原形動詞）。"},
{s:1,w:"mandatory",q:"Wearing a helmet is mandatory throughout the construction area.",qf:"mandatory",qt:"在整個工地範圍內都必須配戴安全帽。",mem:"man（手）+ dat（給）＝ 交到你手上的命令，非做不可。同族 mandate、command。",p:"adj.",z:"強制的；必須的",f:"mandatory",e:"Attendance at the safety training is mandatory for all staff.",t:"全體員工都必須出席安全訓練。",c:["mandatory training","mandatory retirement"],k:"＝ required、compulsory；反義 optional、voluntary。"},
{s:1,w:"supervisor",q:"Any schedule change must be approved by a supervisor.",qf:"supervisor",qt:"任何班表變動都須經主管核准。",mem:"super（上方）+ vis（看）＝ 在上面看著你的人。",p:"n.",z:"主管；督導",f:"supervisor",e:"Submit your leave request to your immediate supervisor.",t:"請將請假申請交給你的直屬主管。",c:["immediate supervisor","under the supervision of"],k:"動詞 supervise、名詞 supervision。聽力常出現 report to your supervisor。"},
{s:1,w:"personnel",q:"Only authorized personnel may enter the laboratory.",qf:"personnel",qt:"僅限獲授權人員進入實驗室。",mem:"重音在最後：person-NEL，像在喊「人事部」；personal 重音在最前面 PER-sonal。重音一移，意思就換人。",p:"n.",z:"人事（部門）；全體人員",f:"personnel",e:"Contact the personnel office for questions about your contract.",t:"合約相關問題請洽人事室。",c:["personnel department","authorized personnel only"],k:"重音在最後 /ˌpɜːrsəˈnel/，別跟 personal（個人的）搞混，這組是聽力經典陷阱。"},
{s:2,w:"compensation",q:"The offer includes relocation costs as part of the compensation.",qf:"compensation",qt:"這份聘約將搬遷費用納入薪酬的一部分。",mem:"com + pens（秤、量）＝ 把付出秤一秤補回來。同族 pension 退休金、expense 支出。",p:"n.",z:"薪酬；補償",f:"compensation",e:"The package includes a competitive compensation plan.",t:"這份方案包含具競爭力的薪酬計畫。",c:["compensation package","compensate for"],k:"動詞 compensate sb for sth。徵才文中指「整體薪酬」，不只月薪。"},
{s:2,w:"probation",q:"She was confirmed in the role after passing probation.",qf:"probation",qt:"她通過試用期後正式任用。",mem:"prob（測試）→ probe 探測、prove 證明。試用期就是你被測試的那段期間。",p:"n.",z:"試用期",f:"probation",e:"New hires are evaluated at the end of their probation period.",t:"新進人員會在試用期結束時接受評估。",c:["probation period","on probation"],k:"形容詞 probationary。三個月試用期是多益公告題的常見設定。"},
{s:2,w:"orientation",q:"Every intern attends a half-day orientation on arrival.",qf:"orientation",qt:"每位實習生報到時都要參加半天的職前說明。",mem:"orient 是東方——古人靠找東方定方位，所以幫新人「找到方向」就是 orientation。",p:"n.",z:"新人訓練；職前說明",f:"orientation",e:"The orientation session for new employees begins at nine.",t:"新進員工的職前說明會九點開始。",c:["orientation session","attend an orientation"],k:"別譯成「方向」。行事曆與公告題高頻。"},
{s:2,w:"promote",q:"Two engineers were promoted following the annual review.",qf:"promoted",qt:"兩名工程師在年度考核後獲得升職。",mem:"pro（向前）+ mote（移動）＝ 人往前移是升職，商品往前推是促銷。同一個動作兩個場景。",p:"v.",z:"升職；推廣",f:"promoted",e:"She was promoted to regional manager after two years.",t:"她兩年後被升任為區域經理。",c:["be promoted to + 職位","promote a product"],k:"一字兩義：升職＋促銷。名詞 promotion 同樣兩義，看上下文。"},
{s:2,w:"resign",q:"He agreed to stay three months after choosing to resign.",qf:"resign",qt:"他決定辭職後同意再留任三個月。",mem:"re（回）+ sign（簽）＝ 把聘書簽回去。",p:"v.",z:"辭職",f:"resigned",e:"The chief financial officer resigned for personal reasons.",t:"財務長因個人因素辭職。",c:["resign from a position","submit a resignation"],k:"名詞 resignation。resign 是自己走，be laid off 是被裁。"},
{s:2,w:"retirement",q:"The fund allows early withdrawal only upon retirement.",qf:"retirement",qt:"該基金僅在退休時允許提前提領。",mem:"re + tire（拉）＝ 把自己從職場拉回來。",p:"n.",z:"退休",f:"retirement",e:"A reception will be held to celebrate his retirement.",t:"公司將舉辦餐會慶祝他退休。",c:["retirement party","early retirement"],k:"動詞 retire。retirement party 是聽力最愛的辦公室場景。"},
{s:2,w:"workforce",q:"Automation has reduced the plant's workforce by a quarter.",qf:"workforce",qt:"自動化使該廠人力減少了四分之一。",mem:"work + force ＝ 工作的「兵力」，指全體人力。",p:"n.",z:"勞動力；全體員工",f:"workforce",e:"Nearly half of the workforce works remotely.",t:"將近半數員工採遠距工作。",c:["expand the workforce","a skilled workforce"],k:"集合名詞，動詞多用單數。與 staff、personnel 同類。"},
{s:2,w:"incentive",q:"Free parking is offered as an incentive to commute early.",qf:"incentive",qt:"提供免費停車作為早班通勤的誘因。",mem:"in + cent（唱）＝ 古義是「唱歌激勵人」。記不住就用諧音：in-cent，給你點錢。",p:"n.",z:"獎勵；誘因",f:"incentive",e:"The company offers a cash incentive for meeting sales targets.",t:"公司為達成銷售目標提供現金獎勵。",c:["offer an incentive","incentive program"],k:"an incentive to + 原形動詞。人資與行銷兩個場景都會出現。"},
{s:2,w:"turnover",q:"Staff turnover fell sharply after the new benefits took effect.",qf:"turnover",qt:"新福利生效後員工流動率大幅下降。",mem:"turn over 是「翻過去」——人一個個翻走是流動率，錢翻過一輪是營業額。",p:"n.",z:"員工流動率；營業額",f:"turnover",e:"High employee turnover has become a serious concern.",t:"高員工流動率已成為嚴重問題。",c:["employee turnover","annual turnover"],k:"一字兩義：人事流動率＋營業額。看前面搭配什麼字判斷。"},
{s:2,w:"reference",q:"Applicants should list two references from previous employers.",qf:"references",qt:"應徵者應列出兩位前雇主的推薦人。",mem:"re + fer（帶）＝ 把你帶到某人面前的那個人。同族 transfer 轉移、prefer 偏好。",p:"n.",z:"推薦人；推薦信",f:"references",e:"Applicants should provide two professional references.",t:"應徵者應提供兩位專業推薦人。",c:["provide references","a letter of reference"],k:"求職語境指「推薦人」，不是「參考」。動詞 refer to。"}
]},

{n:3,theme:"一場會議的前後",story:"從發出議程到會後追蹤——Part 3 對話與 Part 4 通知幾乎有三分之一落在這個場景。",
 arc:[["會前準備","議程、場地、出席確認。"],["會議進行與追蹤","討論、決議、後續。"]],
 words:[
{s:1,w:"agenda",q:"The final item on the agenda was postponed to next week.",qf:"agenda",qt:"議程上的最後一項延到下週。",mem:"拉丁文原意就是「該做的事」。和 agent（做事的人）同源。",p:"n.",z:"議程",f:"agenda",e:"The agenda for tomorrow's meeting has been emailed to everyone.",t:"明天會議的議程已用電子郵件寄給大家。",c:["on the agenda","set the agenda"],k:"item on the agenda ＝ 議程項目。別跟 calendar（行事曆）混用。"},
{s:1,w:"attendee",q:"Each attendee received a name badge at the door.",qf:"attendee",qt:"每位出席者在門口領取名牌。",mem:"attend + ee。-ee 結尾是承受的一方：employee、trainee、interviewee。",p:"n.",z:"出席者",f:"attendees",e:"All attendees will receive a copy of the handouts.",t:"所有出席者都會拿到一份講義。",c:["conference attendees","registered attendees"],k:"attend（v.）→ attendee（出席的人）／attendance（出席率）／attendant（服務員），四字常混考。"},
{s:1,w:"venue",q:"The organizers chose a larger venue after registrations doubled.",qf:"venue",qt:"報名人數倍增後，主辦方改選了更大的場地。",mem:"字根 ven ＝ 來（avenue 大道、convene 集合）。大家「來」的那個地方就是場地。",p:"n.",z:"場地；地點",f:"venue",e:"The venue was changed to the third-floor conference room.",t:"場地改到三樓會議室。",c:["change the venue","an ideal venue"],k:"專指活動舉辦地點，比 place 精確。改場地是聽力經典轉折。"},
{s:1,w:"convene",q:"The panel will convene once all reports have been filed.",qf:"convene",qt:"所有報告提交後，小組將召開會議。",mem:"con（一起）+ ven（來）＝ 一起來。相對詞 adjourn 是「散開」。",p:"v.",z:"召開；集合",f:"convene",e:"The committee will convene at nine sharp on Monday.",t:"委員會將於週一九點整召開。",c:["convene a meeting","the meeting convenes"],k:"可及物可不及物。相對詞 adjourn（休會）。"},
{s:1,w:"postpone",q:"Heavy rain forced organizers to postpone the outdoor ceremony.",qf:"postpone",qt:"大雨迫使主辦單位延後戶外典禮。",mem:"post（之後）+ pone（放）＝ 放到之後。後面接 V-ing，不接 to V。",p:"v.",z:"延期",f:"postponed",e:"The quarterly review has been postponed until next week.",t:"季度檢討會已延期至下週。",c:["postpone a meeting","postpone V-ing"],k:"後接 V-ing 不接 to V。同義 put off、delay。"},
{s:1,w:"reschedule",q:"The dentist offered to reschedule my appointment for Friday.",qf:"reschedule",qt:"牙醫提議把我的預約改到週五。",mem:"re + schedule。改到哪天用 for：reschedule for Thursday。",p:"v.",z:"改期；重新安排",f:"reschedule",e:"Could we reschedule the call for Thursday afternoon?",t:"我們能把電話會議改到週四下午嗎？",c:["reschedule for + 時間","reschedule an appointment"],k:"reschedule for（改到某時）。聽力改期題答案句常用這個字。"},
{s:1,w:"handout",q:"Please take a handout from the table before sitting down.",qf:"handout",qt:"入座前請從桌上取一份講義。",mem:"hand out（發下去）變成名詞，就是被發下去的那疊紙。",p:"n.",z:"講義；資料",f:"handouts",e:"Extra handouts are available at the registration desk.",t:"報到處備有多餘的講義。",c:["distribute handouts","pick up a handout"],k:"由 hand out（分發）名詞化。多益簡報場景固定班底。"},
{s:1,w:"preliminary",q:"The preliminary findings suggest that the new layout improves efficiency.",qf:"preliminary",qt:"初步發現顯示新配置提升了效率。",mem:"pre（前）+ limin（門檻，如 eliminate 踢出門外）＝ 還停在門檻前的階段。",p:"adj.",z:"初步的；預備的",f:"preliminary",e:"The preliminary results will be released on Friday.",t:"初步結果將於週五公布。",c:["preliminary results","a preliminary report"],k:"與 final 相對。常與 tentative 一起考「尚未定案」的語意。"},
{s:1,w:"confirm",q:"The airline will confirm your seat within twenty-four hours.",qf:"confirm",qt:"航空公司將在二十四小時內確認你的座位。",mem:"con（加強）+ firm（牢固）＝ 讓事情變得牢靠。",p:"v.",z:"確認",f:"confirm",e:"Please confirm your attendance by replying to this email.",t:"請回覆此信以確認你的出席。",c:["confirm attendance","confirmation number"],k:"名詞 confirmation。訂位、報名、出席三大場景都用它。"},
{s:1,w:"quarterly",q:"Managers receive a quarterly summary of department spending.",qf:"quarterly",qt:"主管每季收到一份部門支出摘要。",mem:"quarter 是四分之一——一年切成四塊，每塊一次。",p:"adj./adv.",z:"季度的；每季",f:"quarterly",e:"The board holds a quarterly meeting to review performance.",t:"董事會每季召開會議檢討績效。",c:["quarterly report","quarterly earnings"],k:"同一家族：weekly／monthly／quarterly／biannual／annual，時間題常考。"},
{s:2,w:"facilitate",q:"The software was designed to facilitate remote collaboration.",qf:"facilitate",qt:"這套軟體是為促進遠距協作而設計的。",mem:"facil ＝ 容易（facile、facility）。使事情變容易，就是促進、主持。",p:"v.",z:"促進；主持（會議）",f:"facilitate",e:"A consultant was hired to facilitate the workshop.",t:"公司聘請一位顧問來主持這場工作坊。",c:["facilitate discussion","facilitate the process"],k:"字面「使容易」。名詞 facilitator（主持人）、facility（設施）不同義。"},
{s:2,w:"consensus",q:"No consensus emerged after four hours of debate.",qf:"consensus",qt:"經過四小時辯論仍未形成共識。",mem:"con（一起）+ sens（感覺）＝ 大家感覺一致。同族 sense、sensitive。",p:"n.",z:"共識",f:"consensus",e:"The team finally reached a consensus on the new logo.",t:"團隊終於就新標誌達成共識。",c:["reach a consensus","a general consensus"],k:"不可數，前面不加 a…s。固定搭配 reach／come to a consensus。"},
{s:2,w:"address",q:"The mayor will address concerns about the new highway.",qf:"address",qt:"市長將處理外界對新高速公路的疑慮。",mem:"本義是「把話直直送過去」——對著問題講是處理，對著聽眾講是演說，對著信封寫是地址。",p:"v.",z:"處理；針對…發言",f:"address",e:"The manager will address the concerns raised by staff.",t:"經理將處理員工提出的疑慮。",c:["address an issue","address the audience"],k:"多益考「處理、談及」遠多於「地址」。address ＋ 問題，不加 to。"},
{s:2,w:"outline",q:"The report outlines three options for reducing waste.",qf:"outlines",qt:"報告概述了三種減少廢棄物的方案。",mem:"out + line ＝ 只畫外框線，不填細節，就是大綱。",p:"v./n.",z:"概述；大綱",f:"outlined",e:"She outlined the three phases of the project.",t:"她概述了專案的三個階段。",c:["outline a plan","a brief outline"],k:"＝ summarize、sketch out。簡報動詞群的常見選項。"},
{s:2,w:"adjourn",q:"The hearing will adjourn until further evidence is available.",qf:"adjourn",qt:"聽證會將休會，直到取得更多證據。",mem:"ad + journ（日，如 journal 日誌）＝ 挪到另一天再說。",p:"v.",z:"休會；散會",f:"adjourned",e:"The meeting was adjourned until two o'clock.",t:"會議休會至兩點。",c:["adjourn a meeting","stand adjourned"],k:"與 convene 成對。be adjourned until + 時間。"},
{s:2,w:"minutes",q:"The secretary distributed the minutes within an hour.",qf:"minutes",qt:"秘書在一小時內分發了會議紀錄。",mem:"會議紀錄要記得很細（minute 作形容詞是「微小的」）。只有複數形才是紀錄。",p:"n.",z:"會議紀錄",f:"minutes",e:"Please circulate the minutes to everyone who attended.",t:"請將會議紀錄分送給所有出席者。",c:["take the minutes","circulate the minutes"],k:"複數形才是「會議紀錄」，和「分鐘」同形不同義。take minutes ＝ 做紀錄。"},
{s:2,w:"participant",q:"Each participant must sign a confidentiality form.",qf:"participant",qt:"每位參與者都必須簽署保密同意書。",mem:"part（部分）+ cip（拿）＝ 拿走其中一部分＝參與其中。動詞後面永遠跟 in。",p:"n.",z:"參與者",f:"participants",e:"All participants are asked to complete a short survey.",t:"參與者被要求填寫一份簡短問卷。",c:["participants in the study","active participation"],k:"動詞 participate in（不可省 in）。attendee 偏「出席」，participant 偏「投入」。"},
{s:2,w:"deliberate",q:"The jury will deliberate before returning a verdict.",qf:"deliberate",qt:"陪審團將先行審議再作出裁決。",mem:"de + liber（秤）＝ 放上秤仔細衡量。衡量過才動手，所以也指「蓄意的」。",p:"v./adj.",z:"審議；蓄意的",f:"deliberate",e:"The committee will deliberate before announcing a decision.",t:"委員會將先行審議再宣布決定。",c:["deliberate on an issue","a deliberate choice"],k:"動詞唸 /-eɪt/、形容詞唸 /-ət/。副詞 deliberately ＝ 故意地。"},
{s:2,w:"follow-up",q:"A follow-up call is scheduled for early next month.",qf:"follow-up",qt:"後續追蹤電話已排定於下月初。",mem:"名詞有連字號、動詞片語沒有——這個差別本身就是 Part 5 的考點。",p:"n./adj.",z:"後續追蹤",f:"follow-up",e:"A follow-up email will be sent after the workshop.",t:"工作坊結束後會寄出一封後續追蹤信。",c:["a follow-up meeting","follow up on"],k:"名詞有連字號 follow-up，動詞片語沒有 follow up on。"},
{s:2,w:"unanimous",q:"The decision to relocate was unanimous among the partners.",qf:"unanimous",qt:"遷址的決定在合夥人之間一致通過。",mem:"un(i)（一）+ anim（心、生命，如 animal）＝ 同一條心。",p:"adj.",z:"一致同意的",f:"unanimous",e:"The proposal received unanimous approval from the board.",t:"該提案獲得董事會一致通過。",c:["unanimous decision","vote unanimously"],k:"uni-（一）＋ anim（心）＝ 同一條心。副詞 unanimously。"}
]},

{n:4,theme:"一趟出差的全程",story:"訂票、登機、住宿、報帳——多益最愛的旅行場景，Part 2 到 Part 7 通吃。",
 arc:[["出發前","訂位、行程、確認。"],["抵達後","住宿、設施、報帳。"]],
 words:[
{s:1,w:"itinerary",q:"Any change to the itinerary must be approved in advance.",qf:"itinerary",qt:"行程的任何變更都必須事先核准。",mem:"字根 iter ＝ 旅程。四音節 i-TIN-er-ary，唸順三次就記住了。",p:"n.",z:"行程表",f:"itinerary",e:"Your updated itinerary is attached to this message.",t:"你的更新行程表已附在這封訊息中。",c:["a detailed itinerary","travel itinerary"],k:"發音 /aɪˈtɪnəreri/，四音節，聽力容易漏聽。指整份行程安排，不只班機。"},
{s:1,w:"reservation",q:"Your reservation will be held until eight o'clock.",qf:"reservation",qt:"您的訂位將保留至八點。",mem:"reserve（保留）＝ 幫你保留一個位子。另一義「保留意見」也是同一個畫面。",p:"n.",z:"預訂；訂位",f:"reservation",e:"I'd like to make a reservation for four at seven o'clock.",t:"我想訂七點四位的位子。",c:["make a reservation","confirm a reservation"],k:"動詞 reserve。另一義「保留意見」（have reservations about）。"},
{s:1,w:"departure",q:"Passengers should arrive two hours before departure.",qf:"departure",qt:"旅客應在出發前兩小時抵達。",mem:"de（離開）+ part（分開）＝ 分開離去。",p:"n.",z:"出發；離站",f:"departure",e:"The departure has been delayed by about forty minutes.",t:"出發時間已延誤約四十分鐘。",c:["departure gate","departure time"],k:"動詞 depart from。與 arrival 成對，機場廣播必考。"},
{s:1,w:"layover",q:"A shorter layover would leave no time for immigration.",qf:"layover",qt:"停留時間再短，就沒有時間辦理入境了。",mem:"lay over ＝ 躺一下。在轉機點躺一會兒再走。",p:"n.",z:"轉機停留",f:"layover",e:"We have a three-hour layover in Singapore.",t:"我們在新加坡有三小時的轉機停留。",c:["a short layover","a layover in + 地點"],k:"英式常說 stopover。行程題會拿轉機時間長短出題。"},
{s:1,w:"boarding",q:"The gate agent announced that boarding would be delayed.",qf:"boarding",qt:"登機門人員宣布登機將延後。",mem:"board 本義是「板子」——上船要走踏板，所以登機是 board。動詞不加 on。",p:"n.",z:"登機",f:"boarding",e:"General boarding will begin thirty minutes before takeoff.",t:"登機將於起飛前三十分鐘開始。",c:["boarding pass","boarding gate"],k:"動詞 board（登上，及物，不加 on）：board the plane。"},
{s:1,w:"confirmation",q:"Bring a printed confirmation if you have no smartphone.",qf:"confirmation",qt:"若沒有智慧型手機，請攜帶列印的確認函。",mem:"confirm + ation。訂房訂票必問的那組數字就叫 confirmation number。",p:"n.",z:"確認（函／編號）",f:"confirmation",e:"Please keep your confirmation number for check-in.",t:"請保留你的確認編號以便報到。",c:["confirmation number","confirmation email"],k:"訂房訂票題最愛考「請提供確認編號」這一句。"},
{s:1,w:"accommodation",q:"The grant covers travel but not accommodation.",qf:"accommodation",qt:"該補助涵蓋交通，但不含住宿。",mem:"ac + commod（方便，如 commodious 寬敞）＝ 讓你住得方便的地方。",p:"n.",z:"住宿",f:"accommodation",e:"The company covers accommodation for business trips.",t:"公司負擔出差的住宿費用。",c:["arrange accommodation","overnight accommodation"],k:"美式常用複數 accommodations。動詞 accommodate（容納、提供住宿）。"},
{s:1,w:"shuttle",q:"The shuttle stops at each terminal every fifteen minutes.",qf:"shuttle",qt:"接駁車每十五分鐘停靠各航廈一次。",mem:"織布機來回穿梭的那根「梭子」就叫 shuttle——來回跑的車也是。",p:"n.",z:"接駁車",f:"shuttle",e:"A free shuttle runs between the hotel and the airport.",t:"飯店與機場之間有免費接駁車。",c:["airport shuttle","shuttle service"],k:"聽力常出現 The shuttle departs every 20 minutes。"},
{s:1,w:"delay",q:"The delay was caused by an unscheduled mechanical inspection.",qf:"delay",qt:"這次延誤是臨時的機械檢查造成的。",mem:"de + lay ＝ 擱著不動。without delay 就是「不擱」＝ 立刻。",p:"n./v.",z:"延誤",f:"delay",e:"Passengers were notified of the delay by text message.",t:"旅客透過簡訊獲知延誤消息。",c:["a two-hour delay","without delay"],k:"without delay ＝ 立即。be delayed by（因…而延誤）。"},
{s:1,w:"detour",q:"A landslide forced traffic onto a long detour.",qf:"detour",qt:"山崩迫使車流繞行很長一段路。",mem:"de + tour（繞行）＝ 繞開原路走。",p:"n.",z:"繞道；改道",f:"detour",e:"Drivers should take a detour due to road construction.",t:"因道路施工，駕駛應改道行駛。",c:["take a detour","a temporary detour"],k:"交通公告題高頻，通常搭配 construction、closure 一起出現。"},
{s:2,w:"complimentary",q:"Guests in suites receive complimentary airport transfers.",qf:"complimentary",qt:"套房住客可享免費機場接送。",mem:"用中間那個字母記：complEmentary 有 E，是 complEte（補完）的親戚＝互補；compl I mentary 是 compl I ment（讚美）的親戚＝送你的、免費的。",p:"adj.",z:"免費招待的",f:"complimentary",e:"Guests receive a complimentary breakfast each morning.",t:"住客每天早上享有免費早餐。",c:["complimentary breakfast","complimentary upgrade"],k:"陷阱：complimentary（免費的）vs complementary（互補的），拼字只差一個字母。"},
{s:2,w:"amenity",q:"The listing exaggerated the amenities available on site.",qf:"amenities",qt:"該廣告誇大了現場可用的設施。",mem:"amen ＝ 愉快（同 amiable 和藹可親）。讓人住得愉快的東西就是設施。",p:"n.",z:"（旅館）設施",f:"amenities",e:"The hotel's amenities include a gym and a rooftop pool.",t:"這間飯店的設施包含健身房與頂樓泳池。",c:["hotel amenities","on-site amenities"],k:"通常用複數。飯店廣告與評論題的固定字。"},
{s:2,w:"occupancy",q:"Average occupancy fell below sixty percent during the off-season.",qf:"occupancy",qt:"淡季期間平均入住率跌破六成。",mem:"occupy（佔用）→ 房間被佔用的比例＝入住率。",p:"n.",z:"入住率；使用率",f:"occupancy",e:"Hotel occupancy rates rose sharply during the festival.",t:"節慶期間入住率大幅上升。",c:["occupancy rate","maximum occupancy"],k:"動詞 occupy、形容詞 occupied（已佔用）。圖表題常見。"},
{s:2,w:"voucher",q:"The airline issued a meal voucher to stranded passengers.",qf:"voucher",qt:"航空公司發給滯留旅客餐點抵用券。",mem:"vouch 是「擔保」——一張擔保你能換到東西的紙。",p:"n.",z:"抵用券；憑證",f:"voucher",e:"Each guest received a voucher for a free meal.",t:"每位住客都獲得一張免費餐點抵用券。",c:["a meal voucher","redeem a voucher"],k:"搭配動詞 redeem（兌換）。與 coupon 近義。"},
{s:2,w:"reimburse",q:"The company will not reimburse expenses without receipts.",qf:"reimburse",qt:"公司不會報銷沒有收據的費用。",mem:"re（回）+ burse（錢包，就是 purse）＝ 把錢放回你的錢包裡。",p:"v.",z:"報銷；償還",f:"reimbursed",e:"Employees will be reimbursed for travel expenses within two weeks.",t:"員工的差旅費用將於兩週內報銷。",c:["reimburse sb for sth","reimbursement form"],k:"be reimbursed for + 費用。名詞 reimbursement，出差場景必考。"},
{s:2,w:"receipt",q:"Keep the receipt in case the item needs to be exchanged.",qf:"receipt",qt:"請保留收據，以備需要換貨。",mem:"p 不發音，唸 /rɪ-SEET/。那個沉默的 p 像收據被撕掉的一角。",p:"n.",z:"收據",f:"receipts",e:"Attach all original receipts to the expense report.",t:"請將所有原始收據附在費用報告後。",c:["original receipt","upon receipt of"],k:"p 不發音 /rɪˈsiːt/。upon receipt of ＝ 一收到…就。"},
{s:2,w:"expense",q:"Legal fees turned out to be the largest expense.",qf:"expense",qt:"法律費用最後成了最大的一筆開銷。",mem:"ex（出）+ pens（秤、付）＝ 秤出去的錢。和 compensation 同一個字根。",p:"n.",z:"開銷；費用",f:"expenses",e:"All expenses must be approved by your supervisor.",t:"所有費用都須經你的主管核准。",c:["travel expenses","at the expense of"],k:"形容詞 expensive。expense report（費用報告）出差題必出。"},
{s:2,w:"vicinity",q:"No parking is available in the immediate vicinity of the hall.",qf:"vicinity",qt:"會館緊鄰一帶沒有停車位。",mem:"vicin ＝ 鄰近。固定用 in the vicinity of，介系詞是 of。",p:"n.",z:"附近一帶",f:"vicinity",e:"Several restaurants are located in the vicinity of the hotel.",t:"飯店附近一帶有好幾家餐廳。",c:["in the vicinity of","the immediate vicinity"],k:"固定用 in the vicinity of。比 near 正式，Part 7 地點題常見。"},
{s:2,w:"depart",q:"The ferry departs for the island twice each morning.",qf:"departs",qt:"渡輪每天早上兩班前往該島。",mem:"from 是「從哪裡出發」、for 是「往哪裡去」——介系詞決定方向，不是動詞。",p:"v.",z:"出發；離開",f:"departs",e:"The last train departs from platform three at midnight.",t:"末班車午夜自第三月台發車。",c:["depart from","depart for + 目的地"],k:"depart from（從某地出發）vs depart for（前往某地），介系詞決定方向。"},
{s:2,w:"en route",q:"The driver called to say he was en route with the samples.",qf:"en route",qt:"司機來電表示他正帶著樣品在路上。",mem:"法文借字，唸 /ɑːn ROOT/，字面就是「在路（route）上」。",p:"phr.",z:"在途中",f:"en route",e:"The package is currently en route to the branch office.",t:"包裹目前正在寄往分公司的途中。",c:["en route to","be en route"],k:"法文來源，唸 /ɑːn ˈruːt/。物流與交通題的高階用字。"}
]},

{n:5,theme:"一箱貨的旅程",story:"下單、出貨、缺件、退換——Part 7 的採購信與物流通知，幾乎全在這批字裡。",
 arc:[["下單與出貨","訂單、倉儲、運送。"],["庫存與異常","缺貨、瑕疵、補救。"]],
 words:[
{s:1,w:"inventory",q:"Discrepancies appeared when the annual inventory was checked.",qf:"inventory",qt:"年度庫存清點時出現了差異。",mem:"invent 本義是「找到」——盤點就是把東西一件件找出來列清單。",p:"n.",z:"庫存；存貨清單",f:"inventory",e:"The store closes early once a month to take inventory.",t:"這家店每月提早打烊一次以清點庫存。",c:["take inventory","inventory levels"],k:"take inventory ＝ 盤點。美式用 inventory，英式用 stock。"},
{s:1,w:"shipment",q:"The second shipment cleared customs without any delay.",qf:"shipment",qt:"第二批貨順利通關，毫無延誤。",mem:"ship（運）+ ment（結果物）＝ 運出去的「那一批」。shipping 是運送這個動作，不會抵達。",p:"n.",z:"貨運；出貨批次",f:"shipment",e:"The latest shipment arrived two days ahead of schedule.",t:"最新一批貨提前兩天送達。",c:["a delayed shipment","track a shipment"],k:"shipment 是「一批貨」，shipping 是「運送這件事」，兩者常互相干擾。"},
{s:1,w:"warehouse",q:"Temperatures inside the warehouse are monitored continuously.",qf:"warehouse",qt:"倉庫內的溫度受到持續監控。",mem:"ware ＝ 貨物（hardware、software 的 ware）＋ house ＝ 放貨的房子。",p:"n.",z:"倉庫",f:"warehouse",e:"Excess stock is stored in the warehouse on Baker Street.",t:"多餘的存貨存放在貝克街的倉庫。",c:["a distribution warehouse","warehouse staff"],k:"複合字 ware（貨物）＋ house。動詞用法指「入庫存放」。"},
{s:1,w:"dispatch",q:"Orders received before noon are dispatched the same day.",qf:"dispatched",qt:"中午前收到的訂單當日發出。",mem:"dis（離開）+ patch（迅速送）＝ 快速發出去。人和貨都能 dispatch。",p:"v./n.",z:"發送；派遣",f:"dispatched",e:"Your order was dispatched from our facility this morning.",t:"您的訂單今早已自本廠發出。",c:["dispatch an order","dispatch a technician"],k:"貨可以 dispatch，人也可以。物流通知信的固定動詞。"},
{s:1,w:"freight",q:"Rising fuel prices pushed freight rates to a record high.",qf:"freight",qt:"燃料價格上漲把運費推上歷史新高。",mem:"唸 /freɪt/，和 eight、weight 同韻——ei 在這組字裡都發長 A。",p:"n.",z:"貨運；運費",f:"freight",e:"Air freight costs considerably more than sea freight.",t:"空運費用比海運貴得多。",c:["air freight","freight charges"],k:"唸 /freɪt/，ei 發長音 A。與 cargo 近義，但 freight 更常指運送服務與費用。"},
{s:1,w:"courier",q:"A courier delivered the contract just before the deadline.",qf:"courier",qt:"快遞在截止前送達了合約。",mem:"字根 cur ＝ 跑（current 水流、occur 發生）。跑腿送件的人就是 courier。",p:"n.",z:"快遞（公司／人員）",f:"courier",e:"A courier will collect the documents at four o'clock.",t:"快遞人員將於四點來收取文件。",c:["a courier service","send by courier"],k:"唸 /ˈkʊriər/。指急件專送，比一般 mail 快。"},
{s:1,w:"carrier",q:"Choosing a reliable carrier reduces the risk of damage.",qf:"carrier",qt:"選擇可靠的承運業者可降低損壞風險。",mem:"carry + er ＝ 載運的那一方。航空公司也叫 carrier。",p:"n.",z:"貨運業者；承運人",f:"carrier",e:"Damage claims must be filed directly with the carrier.",t:"損毀索賠須直接向承運業者提出。",c:["a shipping carrier","the carrier's liability"],k:"航空公司也叫 carrier。與 vendor（賣方）分工不同，別混。"},
{s:1,w:"invoice",q:"The invoice was issued in error and has been cancelled.",qf:"invoice",qt:"該請款單開立有誤，已經取消。",mem:"invoice 是「請你付錢」的單，receipt 是「你已付錢」的憑證——方向剛好相反。",p:"n./v.",z:"發票；請款單",f:"invoice",e:"Payment is due within 30 days of the invoice date.",t:"款項須於請款單日期後三十天內支付。",c:["issue an invoice","the invoice date"],k:"是「請款單」不是收據（receipt）。動詞：invoice sb for sth。"},
{s:1,w:"wholesale",q:"Buying at wholesale rates cut our material costs sharply.",qf:"wholesale",qt:"以批發價採購大幅降低了我們的材料成本。",mem:"whole（整批）+ sale ＝ 整批出。",p:"n./adj.",z:"批發",f:"wholesale",e:"They offer wholesale prices to registered retailers.",t:"他們對已登記的零售商提供批發價。",c:["wholesale price","a wholesale distributor"],k:"與 retail 成對出現。wholesaler ＝ 批發商。"},
{s:1,w:"retail",q:"The product sells well online but poorly in retail stores.",qf:"retail",qt:"該產品線上熱賣，但在零售門市銷路不佳。",mem:"re + tail（切，同 tailor 裁縫）＝ 切成小份賣。和 wholesale 是一組。",p:"n./adj.",z:"零售",f:"retail",e:"The retail price is nearly double the wholesale cost.",t:"零售價幾乎是批發成本的兩倍。",c:["retail price","a retail outlet"],k:"retailer ＝ 零售商。圖表題常拿 retail vs wholesale 做對比。"},
{s:2,w:"expedite",q:"Paying extra will expedite processing of your application.",qf:"expedite",qt:"加付費用可加快你的申請處理。",mem:"ex + ped（腳，如 pedal、pedestrian）＝ 讓腳步加快。",p:"v.",z:"加快；加速處理",f:"expedite",e:"We can expedite delivery for an additional fee.",t:"加收額外費用即可為您加快送達。",c:["expedite shipping","expedite the process"],k:"＝ speed up，正式用語。客服信中常見 expedite your order。"},
{s:2,w:"backorder",q:"Three of the five items are still on backorder.",qf:"backorder",qt:"五項商品中有三項仍缺貨待補。",mem:"訂單積在後面等貨。和 out of stock（根本沒貨）不同——backorder 是單已經下了。",p:"n.",z:"缺貨待補的訂單",f:"backorder",e:"The item is on backorder until early next month.",t:"該商品缺貨待補，要到下月初才有。",c:["on backorder","clear a backorder"],k:"意思是「已下單但還沒貨」。與 out of stock（單純沒貨）不同。"},
{s:2,w:"defective",q:"A single defective sensor shut down the entire line.",qf:"defective",qt:"一個故障的感測器就讓整條產線停擺。",mem:"de（離開）+ fect（做）＝ 沒做到位的地方。名詞 defect。",p:"adj.",z:"有瑕疵的；故障的",f:"defective",e:"Customers may return any defective merchandise for a full refund.",t:"顧客可將任何瑕疵商品退回並獲全額退款。",c:["defective merchandise","a defective part"],k:"名詞 defect（瑕疵）。退換貨題的關鍵字。"},
{s:2,w:"shortage",q:"The shortage of drivers delayed deliveries across the region.",qf:"shortage",qt:"司機短缺使全區配送延誤。",mem:"short（短少）+ age（狀態）＝ 短少的狀態。",p:"n.",z:"短缺；不足",f:"shortage",e:"A shortage of raw materials delayed the entire production line.",t:"原料短缺使整條生產線延誤。",c:["a labor shortage","a shortage of + 名詞"],k:"a shortage of。相對詞 surplus（過剩）。"},
{s:2,w:"surplus",q:"Last year's surplus was donated to a local charity.",qf:"surplus",qt:"去年的剩餘物資捐給了當地慈善機構。",mem:"sur（超過，如 surface 表面之上）+ plus ＝ 多出來的那些。與 deficit 相反。",p:"n./adj.",z:"過剩；剩餘",f:"surplus",e:"The surplus inventory will be sold at a discount.",t:"過剩的庫存將以折扣價出售。",c:["surplus stock","a trade surplus"],k:"財經語境指「順差、盈餘」，與 deficit（赤字）相對。"},
{s:2,w:"restock",q:"Popular sizes are restocked every Monday morning.",qf:"restocked",qt:"熱門尺寸每週一早上補貨。",mem:"re + stock（進貨）＝ 再進一次貨。",p:"v.",z:"補貨",f:"restocked",e:"The shelves are restocked every Tuesday morning.",t:"貨架每週二早上補貨。",c:["restock the shelves","restocking fee"],k:"re-（再）＋ stock（進貨）。restocking fee ＝ 退貨手續費。"},
{s:2,w:"replacement",q:"A temporary replacement will cover the role until March.",qf:"replacement",qt:"將由臨時接替人員代理該職務至三月。",mem:"re + place ＝ 重新放一個上去。",p:"n.",z:"替換品；接替者",f:"replacement",e:"A free replacement will be sent within five business days.",t:"免費替換品將於五個工作天內寄出。",c:["a replacement part","send a replacement"],k:"一字兩義：替換零件＋接替人選。動詞 replace A with B。"},
{s:2,w:"durable",q:"The packaging must be durable enough to survive shipping.",qf:"durable",qt:"包裝必須耐用到足以承受運送過程。",mem:"dur ＝ 持續（during、duration）＋ able ＝ 撐得久的。",p:"adj.",z:"耐用的",f:"durable",e:"These containers are durable enough for repeated use.",t:"這些容器耐用到足以重複使用。",c:["durable goods","a durable material"],k:"名詞 durability。dur- 字根表「持續」，同族 during、duration。"},
{s:2,w:"discrepancy",q:"The auditor traced the discrepancy to a duplicated entry.",qf:"discrepancy",qt:"稽核員將這項差異追溯到一筆重複入帳。",mem:"dis（分開）+ crep（作響）＝ 兩邊聲音不同調。固定接 between。",p:"n.",z:"差異；不符",f:"discrepancy",e:"Please report any discrepancy between the invoice and the delivery.",t:"請回報請款單與交貨之間的任何不符之處。",c:["a discrepancy between A and B","resolve a discrepancy"],k:"固定搭配 between。帳務與收貨核對題的高階字。"},
{s:2,w:"promptly",q:"Complaints are answered promptly by the service desk.",qf:"promptly",qt:"客訴由服務台迅速回覆。",mem:"prompt 有兩義：快、以及準時。promptly at nine 是「九點整」，不是「九點左右」。",p:"adv.",z:"迅速地；準時地",f:"promptly",e:"Please respond promptly so we can process your claim.",t:"請儘速回覆，以便我們處理您的索賠。",c:["respond promptly","begin promptly at + 時間"],k:"兩義：迅速地＋準時地（promptly at 9 ＝ 九點整）。形容詞 prompt。"}
]},

{n:6,theme:"一份財報背後",story:"營收、成本、稽核、擴張——圖表題與商業新聞最常出現的一批字。",
 arc:[["收支與報表","進來多少、花掉多少。"],["決策與擴張","預測、削減、併購。"]],
 words:[
{s:1,w:"revenue",q:"Advertising accounts for nearly half of the station's revenue.",qf:"revenue",qt:"廣告占該電台將近一半的營收。",mem:"re + venue（來）＝ 回流進來的錢。和場地的 venue 同字根，都是「來」。",p:"n.",z:"營收；收益",f:"revenue",e:"Annual revenue increased by twelve percent last year.",t:"去年年度營收成長了 12%。",c:["annual revenue","generate revenue"],k:"營收是「進帳總額」，profit 是扣掉成本後的獲利，圖表題常設陷阱。"},
{s:1,w:"expenditure",q:"Capital expenditure was frozen until the audit concluded.",qf:"expenditure",qt:"資本支出在稽核結束前被凍結。",mem:"ex（出）+ pend（花、秤）＝ 花出去的。比 expense 更正式、更整體。",p:"n.",z:"支出；開銷",f:"expenditure",e:"The department reduced its expenditure on office supplies.",t:"該部門減少了辦公用品的支出。",c:["capital expenditure","reduce expenditure"],k:"比 expense 更正式、更整體。動詞 expend。"},
{s:1,w:"allocate",q:"Additional staff were allocated to the night shift.",qf:"allocated",qt:"額外人力被分配到夜班。",mem:"al + loc（位置，如 local、location）＝ 分配到各個位置上去。",p:"v.",z:"分配；撥給",f:"allocated",e:"Half of the budget was allocated to product development.",t:"半數預算被分配給產品開發。",c:["allocate funds to","budget allocation"],k:"allocate A to B。名詞 allocation，預算會議題必考。"},
{s:1,w:"audit",q:"The audit revealed no irregularities in the accounts.",qf:"audit",qt:"稽核未在帳目中發現異常。",mem:"audi ＝ 聽（audio、audience）。古代查帳是用「聽」報帳的，所以稽核是 audit。",p:"n./v.",z:"稽核；查帳",f:"audit",e:"An external audit is scheduled for the end of the quarter.",t:"外部稽核安排在本季末進行。",c:["an internal audit","conduct an audit"],k:"名詞 auditor（稽核人員）。唸 /ˈɔːdɪt/。"},
{s:1,w:"fiscal",q:"Results will be restated at the end of the fiscal quarter.",qf:"fiscal",qt:"業績將於該財務季度結束時重新編列。",mem:"拉丁文 fiscus 是國庫的錢籃子——和錢有關的官方年度就是 fiscal year。",p:"adj.",z:"財政的；會計年度的",f:"fiscal",e:"Results for the fiscal year will be announced in April.",t:"該會計年度的業績將於四月公布。",c:["fiscal year","fiscal policy"],k:"fiscal year 常不等於曆年，日期題會拿這點出題。"},
{s:1,w:"overhead",q:"Sharing office space allowed both firms to cut overhead.",qf:"overhead",qt:"共用辦公空間讓兩家公司都降低了營運成本。",mem:"頭頂上（over head）永遠掛著的房租水電，就是固定的營運成本。",p:"n.",z:"經常性支出；營運成本",f:"overhead",e:"Moving to a smaller office significantly reduced overhead.",t:"搬到較小的辦公室大幅降低了營運成本。",c:["reduce overhead","overhead costs"],k:"指房租、水電這類固定開銷，通常不可數。"},
{s:1,w:"margin",q:"Discounting too heavily will erode the profit margin.",qf:"margin",qt:"折扣過大會侵蝕利潤率。",mem:"頁面邊緣的空白也叫 margin——成本與售價之間的那條邊，就是利潤空間。",p:"n.",z:"利潤率；差額",f:"margin",e:"The company operates on a very thin profit margin.",t:"該公司的利潤空間非常薄。",c:["profit margin","a narrow margin"],k:"by a narrow margin ＝ 以些微差距。財經與選舉語境都會用。"},
{s:1,w:"asset",q:"Her language skills are a genuine asset in negotiations.",qf:"asset",qt:"她的語言能力在談判中是真正的資產。",mem:"和 liability 綁在一起記：asset 是你「有」的，liability 是你「欠」的。",p:"n.",z:"資產；有價值的人事物",f:"assets",e:"The firm sold several assets to raise capital.",t:"該公司出售了數項資產以籌措資金。",c:["fixed assets","a valuable asset to the team"],k:"與 liability（負債）相對。也可形容人：她是團隊的資產。"},
{s:1,w:"deficit",q:"The city closed its deficit by delaying two projects.",qf:"deficit",qt:"該市藉由延後兩項工程弭平了赤字。",mem:"de（缺）+ fic（做）＝ 沒做足、短了一截。反義是 surplus。",p:"n.",z:"赤字；不足額",f:"deficit",e:"The budget deficit widened for a third consecutive year.",t:"預算赤字連續第三年擴大。",c:["a budget deficit","run a deficit"],k:"與 surplus（盈餘）相對。唸 /ˈdefɪsɪt/，重音在第一音節。"},
{s:1,w:"outstanding",q:"Interest accrues daily on any outstanding amount.",qf:"outstanding",qt:"任何未付金額都按日計息。",mem:"畫面是「站出來的」——人站出來是傑出，帳款站在那裡沒消掉是未付。同一個畫面兩種用法。",p:"adj.",z:"未付的；傑出的",f:"outstanding",e:"Please settle the outstanding balance by the end of the month.",t:"請於月底前結清未付餘額。",c:["an outstanding balance","an outstanding performance"],k:"高頻雙義字：帳單語境是「未付」，人事語境是「傑出」。"},
{s:2,w:"projection",q:"Every projection assumed that demand would stay flat.",qf:"projection",qt:"每一項預測都假設需求持平。",mem:"pro（向前）+ ject（投擲，如 reject、inject）＝ 往前投射。投射到未來是預測，投射到牆上是投影。",p:"n.",z:"預測；推估",f:"projections",e:"Sales projections for next quarter appear overly optimistic.",t:"下一季的銷售預測看來過於樂觀。",c:["sales projections","revised projections"],k:"動詞 project（推估）。另一義是「投影」，簡報場景也用。"},
{s:2,w:"curtail",q:"Rising costs forced the museum to curtail its opening hours.",qf:"curtail",qt:"成本上升迫使博物館縮減開放時間。",mem:"curt（短促的）+ tail（尾巴）＝ 把尾巴剪短。",p:"v.",z:"削減；縮減",f:"curtail",e:"Management decided to curtail spending on travel.",t:"管理層決定削減差旅支出。",c:["curtail spending","curtail operations"],k:"＝ cut back on、reduce，但更正式。多益偏好正式選項。"},
{s:2,w:"streamline",q:"Merging the two teams helped streamline decision-making.",qf:"streamline",qt:"合併兩個團隊有助於精簡決策流程。",mem:"stream（水流）+ line ＝ 做成流線型，阻力最小——流程也可以流線化。",p:"v.",z:"精簡；使有效率",f:"streamline",e:"New software was introduced to streamline the approval process.",t:"公司導入新軟體以精簡核准流程。",c:["streamline a process","streamline operations"],k:"字面「使成流線型」。流程改善題的標準動詞。"},
{s:2,w:"subsidiary",q:"The Brazilian subsidiary reported its first profitable year.",qf:"subsidiary",qt:"巴西子公司回報了首個獲利年度。",mem:"sub（下面）＝ 掛在母公司底下的。subsidy（補助金）雖然同字首，意思完全不同。",p:"n.",z:"子公司",f:"subsidiaries",e:"The group operates twelve subsidiaries across Asia.",t:"該集團在亞洲經營十二家子公司。",c:["a wholly owned subsidiary","an overseas subsidiary"],k:"別跟 subsidy（補助金）混。形容詞義是「次要的」。"},
{s:2,w:"merger",q:"Regulators blocked the merger on competition grounds.",qf:"merger",qt:"監管機關以競爭為由否決了這樁合併案。",mem:"merge（融合）+ er ＝ 兩家融成一家的那件事。",p:"n.",z:"合併",f:"merger",e:"The merger is expected to close by the end of June.",t:"這樁合併案預計於六月底完成。",c:["a merger with","merger and acquisition"],k:"動詞 merge with。商業新聞題固定出現的字。"},
{s:2,w:"dividend",q:"The company suspended its dividend to preserve cash.",qf:"dividend",qt:"該公司暫停發放股利以保留現金。",mem:"divide（分）+ end ＝ 最後分給股東的那一份。",p:"n.",z:"股利；紅利",f:"dividend",e:"Shareholders will receive a dividend of two dollars per share.",t:"股東每股將獲得兩美元的股利。",c:["pay a dividend","dividend yield"],k:"來自 divide（分配）。股東會通知題常見。"},
{s:2,w:"lucrative",q:"Maintenance contracts proved more lucrative than new sales.",qf:"lucrative",qt:"維修合約比新品銷售更有利可圖。",mem:"lucre 是古字「錢財」——會帶錢來的，就是獲利豐厚的。",p:"adj.",z:"獲利豐厚的",f:"lucrative",e:"The partnership proved highly lucrative for both firms.",t:"這項合作對雙方公司都極為有利可圖。",c:["a lucrative contract","a lucrative market"],k:"＝ profitable，但語氣更強。高階形容詞，Part 5 常當正解。"},
{s:2,w:"installment",q:"The final installment is due within thirty days.",qf:"installment",qt:"最後一期款項須於三十天內支付。",mem:"install（裝上去）→ 一期一期「裝」上去，直到付完。注意 installation（安裝）只差一個字母。",p:"n.",z:"分期付款；（連載）一期",f:"installments",e:"Customers may pay in twelve monthly installments.",t:"顧客可分十二期月付。",c:["pay in installments","the first installment"],k:"固定用 in installments。英式拼作 instalment。"},
{s:2,w:"surge",q:"Applications surged after the tuition waiver was announced.",qf:"surged",qt:"學費減免公布後申請人數激增。",mem:"字根 surg ＝ 升起（insurgent 起義者、resurgence 復甦）＝ 急速竄升。",p:"v./n.",z:"激增；急升",f:"surged",e:"Online orders surged after the holiday campaign launched.",t:"假期活動開跑後線上訂單激增。",c:["a surge in demand","prices surged"],k:"a surge in + 名詞。圖表描述題的高頻動詞，同族 soar、spike。"},
{s:2,w:"depreciation",q:"Vehicles lose most of their value to depreciation early on.",qf:"depreciation",qt:"車輛的價值多在早期因折舊而流失。",mem:"de（往下）+ preci（價值，如 precious 珍貴）＝ 價值往下掉。反義 appreciate 是往上。",p:"n.",z:"折舊；貶值",f:"depreciation",e:"Equipment depreciation is recorded at the end of each year.",t:"設備折舊於每年年底入帳。",c:["asset depreciation","currency depreciation"],k:"動詞 depreciate，反義 appreciate（增值）——這個對比 Part 5 很愛考。"}
]},

{n:7,theme:"一個顧客的來去",story:"從被廣告吸引到申訴退款，這條線把行銷與客服兩個高頻場景串在一起。",
 arc:[["把東西賣出去","活動、通路、客群。"],["把客人留下來","客訴、退款、保固。"]],
 words:[
{s:1,w:"campaign",q:"The campaign was suspended after negative feedback online.",qf:"campaign",qt:"該活動在網路負評後暫停。",mem:"camp（營地）→ 本義是「戰役」。一檔行銷活動就是打一場仗。",p:"n.",z:"（行銷）活動；戰役",f:"campaign",e:"The advertising campaign will run through the summer.",t:"這波廣告活動將持續整個夏天。",c:["launch a campaign","an advertising campaign"],k:"搭配動詞 launch／run。與 promotion（促銷）常一起出現。"},
{s:1,w:"merchandise",q:"Damaged merchandise should be reported within forty-eight hours.",qf:"merchandise",qt:"受損商品應於四十八小時內回報。",mem:"merchant（商人）→ 商人在賣的那些東西。不可數，永遠不加 s。",p:"n.",z:"商品",f:"merchandise",e:"All seasonal merchandise is now thirty percent off.",t:"所有季節性商品現正七折。",c:["seasonal merchandise","return merchandise"],k:"不可數，不加 s。動詞義是「推銷」，重音位置不同。"},
{s:1,w:"demographic",q:"The magazine failed to reach its target demographic.",qf:"demographic",qt:"該雜誌未能觸及其目標客群。",mem:"demo（人民，如 democracy 民主）+ graph（圖）＝ 人口的圖像＝客群輪廓。",p:"n./adj.",z:"客群；人口統計的",f:"demographic",e:"The product targets a younger demographic than before.",t:"這項產品鎖定比以往更年輕的客群。",c:["target demographic","demographic data"],k:"名詞用單數指「某一族群」。市場分析題高頻。"},
{s:1,w:"endorsement",q:"The athlete ended the endorsement after the controversy.",qf:"endorsement",qt:"該運動員在爭議後終止了代言。",mem:"en + dorse（背部，如 dorsal 背鰭）＝ 在支票背面簽名 → 引申為背書、代言。",p:"n.",z:"代言；背書支持",f:"endorsement",e:"A celebrity endorsement boosted sales almost overnight.",t:"名人代言幾乎在一夜之間拉抬了銷量。",c:["a celebrity endorsement","endorse a product"],k:"動詞 endorse。也可指支票背書、政治表態。"},
{s:1,w:"outlet",q:"The brand closed six outlets in a single quarter.",qf:"outlets",qt:"該品牌在單一季度關閉了六家門市。",mem:"out + let（讓出去）＝ 讓東西出去的口子。商品的出口是門市，電流的出口是插座。",p:"n.",z:"門市；通路；插座",f:"outlets",e:"The brand operates forty retail outlets nationwide.",t:"該品牌在全國經營四十家門市。",c:["a retail outlet","a power outlet"],k:"三義字：門市／銷售通路／電源插座，聽力靠上下文判斷。"},
{s:1,w:"subscription",q:"Cancelling a subscription takes effect on the billing date.",qf:"subscription",qt:"取消訂閱於帳單日生效。",mem:"sub（下面）+ scribe（寫）＝ 在下面簽名。同族 describe、prescribe、manuscript。",p:"n.",z:"訂閱",f:"subscription",e:"Your subscription includes unlimited access to the archive.",t:"您的訂閱包含無限次存取檔案庫。",c:["renew a subscription","a monthly subscription"],k:"動詞 subscribe to（不可省 to）。與 renewal 常同時出現。"},
{s:1,w:"testimonial",q:"One testimonial was removed for being misleading.",qf:"testimonial",qt:"有一則推薦見證因具誤導性而被移除。",mem:"testi ＝ 見證（testify 作證）＝ 顧客替你作證的那段話。",p:"n.",z:"顧客推薦；見證",f:"testimonials",e:"The website features testimonials from long-term clients.",t:"網站上刊登了長期客戶的推薦見證。",c:["customer testimonials","a glowing testimonial"],k:"來自 testify（作證）。廣告與網站文案題常見。"},
{s:1,w:"prospective",q:"Brochures are mailed only to prospective buyers.",qf:"prospective",qt:"手冊僅寄送給潛在買家。",mem:"pro（向前）看＝ 潛在的、未來的；perspective 是 per（透過）看＝ 觀點。字首決定意思。",p:"adj.",z:"潛在的；未來的",f:"prospective",e:"Brochures were mailed to all prospective customers.",t:"手冊已寄送給所有潛在客戶。",c:["a prospective client","a prospective employee"],k:"別跟 perspective（觀點）混，這組拼字陷阱 Part 5 很愛。"},
{s:1,w:"anticipate",q:"Nobody anticipated such heavy demand in the first week.",qf:"anticipated",qt:"沒有人預料到第一週會有如此強勁的需求。",mem:"ante（之前）+ cip（拿）＝ 提前先拿。後面接名詞或 V-ing，不接 to V。",p:"v.",z:"預期；預料",f:"anticipates",e:"The company anticipates strong demand during the holidays.",t:"公司預期假期期間需求強勁。",c:["anticipate demand","as anticipated"],k:"後接名詞或 V-ing，不接 to V。名詞 anticipation。"},
{s:1,w:"exceed",q:"Repair costs may exceed the value of the machine itself.",qf:"exceed",qt:"維修費用可能超過機器本身的價值。",mem:"ex（出）+ ceed（走）＝ 走出界線。同族 proceed 前進、succeed 接續成功。",p:"v.",z:"超過；超越",f:"exceeded",e:"Third-quarter sales exceeded all internal forecasts.",t:"第三季銷售超越了所有內部預測。",c:["exceed expectations","exceed the limit"],k:"及物動詞，後面直接接受詞不加介系詞。形容詞 excessive（過度的）。"},
{s:2,w:"complaint",q:"A written complaint triggered a full internal review.",qf:"complaint",qt:"一封書面客訴引發了全面的內部檢討。",mem:"com + plain（捶胸哀嘆的那個 plain）＝ 抱怨出聲。",p:"n.",z:"客訴；抱怨",f:"complaints",e:"The store received several complaints about slow service.",t:"這家店收到數件關於服務緩慢的客訴。",c:["file a complaint","a complaint about"],k:"動詞 complain about／of。file／lodge a complaint ＝ 提出申訴。"},

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const START="2026-08-01", DAY_MS=864e5;
function dayNumber(){const s=new Date(START+"T00:00:00"),n=new Date();
  const t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.floor((t-s)/DAY_MS)+1}
const realDay=dayNumber(), homeDay=Math.min(Math.max(realDay,1),DAYS.length);

  $("#prev").disabled=viewDay<=1; $("#next").disabled=viewDay>=DAYS.length;

function go(n){viewDay=n;load();scrollTo({top:0,behavior:"smooth"})}

const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");

let known=new Set(), filter="all", SET=[];
function seeded(seed){let x=seed*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280}}
function buildSet(dn){
  const day=DAYS[dn-1];
  const nw=day.words.map(w=>({...w,day:dn,rev:false}));
  const prev=DAYS.slice(0,dn-1).flatMap(d=>d.words.map(w=>({...w,day:d.n,rev:true})));
  if(!prev.length) return nw;
  const r=seeded(dn*77), pool=[...prev], pick=[];
  while(pick.length<10&&pool.length) pick.push(pool.splice(Math.floor(r()*pool.length),1)[0]);
  return nw.concat(pick);
}
const hi=d=>esc(d.e).replace(d.f,`<mark>${d.f}</mark>`);

       <div class="mem"><b>記憶點</b>${d.mem}</div>

       <div class="tip"><b>考點 ·</b> ${d.k}</div>

       <button class="mark" data-on="${known.has(i)?1:0}">${known.has(i)?"✓ 已記住":"標記記住"}</button></div>

$("#grid").addEventListener("click",e=>{
  const card=e.target.closest(".card"); if(!card) return;
  const i=+card.dataset.i,d=SET[i];

    speechSynthesis.cancel();speechSynthesis.speak(u);return}
  const mk=e.target.closest(".mark");
  if(mk){known.has(i)?known.delete(i):known.add(i);mk.dataset.on=known.has(i)?1:0;
    mk.textContent=known.has(i)?"✓ 已記住":"標記記住";card.classList.toggle("known",known.has(i));stats();return}
  if(e.target.closest(".head")){const o=card.classList.toggle("open");
    card.querySelector(".head").setAttribute("aria-expanded",o)}
});

function buildQuiz(){Q=shuffle(SET.map((d,i)=>i)).map(i=>{const d=SET[i];
  let pool=SET.filter((x,j)=>j!==i&&x.p===d.p);
  if(pool.length<3)pool=pool.concat(SET.filter((x,j)=>j!==i&&x.p!==d.p));
  return{i,opts:shuffle([d.qf,...shuffle(pool).slice(0,3).map(x=>x.qf)])}});qi=0;wrong=[]}
function drawQ(){answered=false;const{i,opts}=Q[qi],d=SET[i];
  $("#quiz").innerHTML=`<div class="qtop"><span>第 ${qi+1} / ${Q.length} 題</span>
   <div class="track"><i style="width:${qi/Q.length*100}%"></i></div><button class="link" id="close">結束</button></div>
   <p class="qsent">${esc(d.q).replace(d.qf,'<span class="blank"></span>')}</p>
   <p class="qhint">選出最適合填入空格的字</p>
   <div class="opts">${opts.map((o,k)=>`<button class="opt" data-o="${o}"><kbd>${k+1}</kbd>${o}</button>`).join("")}</div>
   <div class="feedback" id="fb"></div><div class="qfoot" id="foot"></div>`}
function pick(choice){answered=true;const{i}=Q[qi],d=SET[i],ok=choice===d.qf;
  if(!ok)wrong.push({d,choice});
  $$(".opt").forEach(b=>{b.disabled=true;if(b.dataset.o===d.qf)b.classList.add("right");
    else if(b.dataset.o===choice)b.classList.add("wrong")});
  $("#fb").className="feedback on";
  $("#fb").innerHTML=`<div><b>${ok?"✓ 正確":"✗ 正解："+d.qf}</b> — ${d.w} <span style="color:#7C7168">${d.p} ${d.z}</span></div>
    <div class="zh" style="margin-top:7px">${esc(d.q).replace(d.qf,`<mark>${d.qf}</mark>`)}</div>
    <div class="zh">${d.qt}</div>
    <div class="zh" style="margin-top:8px">${d.k}</div>
    <div class="zh" style="margin-top:6px;color:#2E5A47">🔑 ${d.mem}</div>`;
  $("#foot").innerHTML=`<button class="primary" id="next2">${qi+1<Q.length?"下一題":"看結果"}</button><span class="qhint">按 Enter 繼續</span>`
  requestAnimationFrame(()=>{const q=$("#quiz");if(q)q.scrollTo({top:q.scrollHeight,behavior:"smooth"})});}
function endQuiz(){const right=Q.length-wrong.length,r=right/Q.length;
  $("#quiz").innerHTML=`<div class="qtop"><span>Day ${viewDay} · Part 5 結果</span><div class="track"><i style="width:100%"></i></div></div>
   <div class="score">${right}<span style="font-size:22px;color:#A79C90"> / ${Q.length}</span></div>
   <p class="qhint">${r>=.9?"這批字已經穩了，往下走。":r>=.7?"底子有了，把錯的字再讀一次例句。":"把錯的字重讀例句與考點，再測一次會跳很多。"}</p>
   ${wrong.length?`<div class="wronglist">${wrong.map(({d,choice})=>`<div class="wrongitem"><b>${d.w}</b> ${d.z}<span>你選了 ${choice}　·　${d.k}</span></div>`).join("")}</div>`:""}
   <div class="qfoot"><button class="primary" id="again">再測一次</button><button class="link" id="close">回到單字卡</button></div>`}
$("#quiz").addEventListener("click",e=>{
  if(e.target.closest("#close"))return $("#overlay").classList.remove("on");
  if(e.target.closest("#next2"))return(qi++,qi<Q.length?drawQ():endQuiz());
  if(e.target.closest("#again"))return(buildQuiz(),drawQ());
  const o=e.target.closest(".opt");if(o&&!answered)pick(o.dataset.o)});
$("#launch").onclick=()=>{buildQuiz();drawQ();$("#overlay").classList.add("on")};
$("#overlay").addEventListener("click",e=>{if(e.target===$("#overlay"))$("#overlay").classList.remove("on")});
document.addEventListener("keydown",e=>{
  if(!$("#overlay").classList.contains("on"))return;
  if(e.key==="Escape")return $("#overlay").classList.remove("on");
  if(!answered&&/^[1-4]$/.test(e.key)){const b=$$(".opt")[+e.key-1];if(b)pick(b.dataset.o)}
  else if(answered&&(e.key==="Enter"||e.key===" ")){e.preventDefault();const n=$("#next2")||$("#again");n&&n.click()}});
load();

</script>
</body>
</html>
