<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Part 7 閱讀｜多益每日訓練</title>
<style>
:root{
  color-scheme:light only;
  --canvas:#FAF6F0; --card:#FFFCF8; --ink:#332E28; --muted:#7C7168; --faint:#A79C90;
  --line:#EDE4D8; --accent:#3F6B55; --accent-soft:#E7F0EA; --good:#4A7A5F; --good-soft:#E6F1E9;
  --warn:#9A6318; --warn-soft:#F9EFDF; --r:16px;
  --shadow:0 1px 2px rgba(94,74,52,.05), 0 8px 24px rgba(94,74,52,.07);
  --shadow-lift:0 2px 4px rgba(94,74,52,.06), 0 16px 40px rgba(94,74,52,.13);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
  font-size:16.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:44px 24px 140px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px}
h1{font-size:clamp(29px,5vw,42px);line-height:1.18;letter-spacing:-.03em;font-weight:700;margin:16px 0 8px}
.sub{color:var(--muted);font-size:16px;max-width:62ch}
.nav{display:flex;align-items:center;gap:8px;margin-top:22px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:11px;font:inherit;font-size:13.5px;
  font-weight:550;padding:8px 14px;cursor:pointer;color:var(--ink);transition:all .22s var(--ease)}
.nav button:hover:not(:disabled){border-color:#DFD2C0;box-shadow:var(--shadow);transform:translateY(-1px)}
.nav button:disabled{opacity:.4;cursor:default}
.nav select{border:1px solid var(--line);background:var(--card);border-radius:11px;font:inherit;font-size:13.5px;
  font-weight:550;padding:8px 12px;color:var(--ink);cursor:pointer}
.today{font-size:12.5px;color:var(--faint);margin-left:4px}
.metrics{display:flex;gap:26px;margin-top:24px;flex-wrap:wrap;align-items:center}
.metric b{display:block;font-size:21px;font-weight:650;letter-spacing:-.02em}
.metric span{font-size:12.5px;color:var(--faint)}
.ring{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--accent);transition:stroke-dasharray .5s var(--ease)}
.ringwrap{position:relative;display:grid;place-items:center}
.ringwrap span{position:absolute;font-size:12px;font-weight:650}
.spine{margin:34px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 24px;box-shadow:var(--shadow)}
.spine-title{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
.stages{display:flex;align-items:flex-start;margin-top:16px}
.stage{flex:1;position:relative;padding-right:12px}
.stage::before{content:"";position:absolute;top:7px;left:0;right:0;height:2px;background:var(--line)}
.stage:last-child::before{right:calc(100% - 14px)}
.dot{position:relative;width:14px;height:14px;border-radius:50%;background:var(--card);
  border:2px solid var(--faint);z-index:1;transition:all .35s var(--ease)}
.stage.on .dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.stage h3{font-size:14.5px;font-weight:650;margin:12px 0 2px;letter-spacing:-.01em}
.stage p{font-size:12.5px;color:var(--muted);line-height:1.45}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:30px 0 18px;position:sticky;top:0;z-index:20;
  padding:14px 0;background:linear-gradient(var(--canvas) 72%,rgba(250,246,240,0))}
.seg{display:flex;background:#F1E8DB;border-radius:12px;padding:4px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font:inherit;
  font-size:13.5px;font-weight:550;padding:7px 14px;border-radius:9px;transition:all .22s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(94,74,52,.12)}
.ghost{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:11px;font:inherit;
  font-size:13.5px;font-weight:550;padding:8px 15px;cursor:pointer;color:var(--ink);transition:all .22s var(--ease)}
.ghost:hover{border-color:#DFD2C0;box-shadow:var(--shadow);transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;transition:box-shadow .3s var(--ease),transform .3s var(--ease),border-color .3s var(--ease);
  animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.card.known{border-color:#C6D9CB} .card.known .head b{color:var(--good)}
.head{width:100%;text-align:left;border:0;background:transparent;font:inherit;cursor:pointer;padding:20px 22px;
  display:flex;gap:12px;align-items:flex-start}
.head b{font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.head .zh{font-size:13.5px;color:var(--muted);margin-top:3px}
.pos{font-size:11px;font-weight:650;color:var(--accent);background:var(--accent-soft);padding:3px 8px;
  border-radius:6px;flex:none;margin-top:4px}
.rev{font-size:10.5px;font-weight:650;color:var(--warn);background:var(--warn-soft);padding:3px 7px;
  border-radius:6px;flex:none;margin-top:4px}
.chev{margin-left:auto;flex:none;color:var(--faint);transition:transform .3s var(--ease)}
.card.open .chev{transform:rotate(180deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease)}
.card.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden}
.inner{padding:0 22px 22px;border-top:1px solid var(--line);margin-top:2px;padding-top:18px}
.sent{font-size:16px;line-height:1.75}
mark{background:linear-gradient(transparent 56%, #F6E1B8 56%);color:inherit;padding:0 1px;font-weight:600}
.sent-zh{font-size:14px;color:var(--muted);margin-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:12.5px;color:#5E5349;background:#F4ECE1;border-radius:7px;padding:4px 9px}
.tip{margin-top:14px;background:var(--warn-soft);border-radius:11px;padding:11px 13px;font-size:13px;
  color:#6E4A16;line-height:1.55}
.acts{display:flex;gap:8px;margin-top:16px}
.acts button{border:1px solid var(--line);background:var(--card);border-radius:10px;font:inherit;font-size:12.5px;
  font-weight:550;padding:7px 12px;cursor:pointer;color:var(--muted);transition:all .2s var(--ease)}
.acts button:hover{color:var(--ink);border-color:#DFD2C0}
.acts button.mark[data-on="1"]{background:var(--good-soft);border-color:#BCD6C4;color:var(--good)}
.launch{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:40;background:var(--accent);
  color:#FFFCF8;border:0;border-radius:14px;font:inherit;font-size:14.5px;font-weight:600;padding:14px 26px;
  cursor:pointer;box-shadow:0 8px 26px rgba(63,107,85,.30);transition:all .25s var(--ease)}
.launch:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 12px 34px rgba(63,107,85,.36)}
.overlay{position:fixed;inset:0;background:rgba(250,246,240,.88);backdrop-filter:blur(14px);z-index:50;
  display:none;place-items:center;padding:20px;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.overlay.on{display:grid}
.quiz{width:100%;max-width:620px;background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow-lift);padding:30px}
.qtop{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--faint);font-weight:550}
.track{flex:1;height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s var(--ease)}
.qsent{font-size:19px;line-height:1.7;margin:24px 0 6px}
.blank{display:inline-block;min-width:110px;border-bottom:2px solid var(--accent)}
.qhint{font-size:13px;color:var(--muted)}
.opts{display:grid;gap:9px;margin-top:20px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1px solid var(--line);
  background:var(--card);border-radius:13px;font:inherit;font-size:15px;padding:14px 16px;cursor:pointer;
  transition:all .2s var(--ease)}
.opt:hover:not(:disabled){border-color:#BFD4C6;background:#FDFAF5;transform:translateX(2px)}
.opt kbd{font:inherit;font-size:11.5px;font-weight:650;color:var(--faint);background:#F2E9DD;border-radius:6px;
  padding:2px 7px;flex:none}
.opt.right{border-color:#A6C9B2;background:var(--good-soft)}
.opt.wrong{border-color:#E0BCA6;background:#FAEDE2}
.opt:disabled{cursor:default}
.feedback{margin-top:18px;border-radius:13px;padding:15px 16px;background:#F7F0E6;font-size:13.5px;
  line-height:1.6;display:none}
.feedback.on{display:block;animation:rise .3s var(--ease)}
.feedback .zh{color:var(--muted);margin-top:5px}
.qfoot{display:flex;gap:10px;margin-top:20px;align-items:center}
.primary{border:0;background:var(--accent);color:#FFFCF8;border-radius:12px;font:inherit;font-size:14px;
  font-weight:600;padding:12px 22px;cursor:pointer;transition:all .22s var(--ease)}
.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.link{border:0;background:none;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;padding:8px}
.link:hover{color:var(--ink)}
.score{font-size:52px;font-weight:700;letter-spacing:-.03em}
.wronglist{margin-top:18px;display:grid;gap:8px;max-height:38vh;overflow:auto}
.wrongitem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.wrongitem span{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
.notice{background:var(--warn-soft);border:1px solid #EBD9BC;border-radius:var(--r);padding:16px 18px;
  font-size:14px;color:#6E4A16;margin-top:20px}
/* ---- Part 6 ---- */
.launchbar{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:40;display:flex;gap:10px}
.launchbar button{border:0;border-radius:14px;font:inherit;font-size:14px;font-weight:600;padding:13px 20px;
  cursor:pointer;transition:all .25s var(--ease)}
.launchbar .p5{background:var(--accent);color:#FFFCF8;box-shadow:0 8px 26px rgba(63,107,85,.30)}
.launchbar .p6{background:var(--card);color:var(--ink);border:1px solid var(--line);
  box-shadow:0 8px 26px rgba(94,74,52,.16)}
.launchbar button:hover{transform:translateY(-2px)}
.quiz.wide{max-width:760px}
.passage{background:#FDF9F3;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:18px 0 4px;
  max-height:34vh;overflow:auto}
.pmeta{font-size:12px;color:var(--faint);line-height:1.7;padding-bottom:10px;margin-bottom:12px;
  border-bottom:1px dashed var(--line)}
.ptext{font-size:15.5px;line-height:1.95}
.bl{display:inline-block;min-width:74px;text-align:center;border-bottom:2px solid var(--faint);
  color:var(--faint);font-size:13px;font-weight:650;transition:all .25s var(--ease)}
.bl.cur{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:5px 5px 0 0}
.bl.done{border-color:var(--good);color:var(--good);font-weight:550}
.bl.done.miss{border-color:#C97B4E;color:#B0693F}
.optlong{font-size:14.5px;line-height:1.5;align-items:flex-start}
.optlong kbd{margin-top:2px}
/* ---- Part 7 ---- */
.quiz.reading{max-width:900px}
.docwrap{max-height:36vh;overflow:auto;margin:16px 0 6px;padding-right:4px}
.doc{background:#FDF9F3;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.doc h4{font-size:14.5px;font-weight:650;letter-spacing:-.01em;margin-bottom:4px}
.doc p{font-size:15px;line-height:2;margin-bottom:11px}
.doc p:last-child{margin-bottom:0}
.sn{transition:background .45s var(--ease),box-shadow .45s var(--ease);border-radius:3px}
.sn.ev{background:#F7E2B6;box-shadow:inset 0 -2px 0 #CE9F3C;padding:1px 2px}
.qtext{font-size:16.5px;font-weight:620;line-height:1.6;margin:10px 0 2px;letter-spacing:-.01em}
.evnote{font-size:12.5px;color:var(--warn);margin-top:12px;font-weight:550}
.glosshead{font-size:13px;font-weight:650;margin:22px 0 10px;padding-top:18px;border-top:1px solid var(--line);
  letter-spacing:-.01em}
.glosshead span{font-weight:500;color:var(--faint);font-size:12px}
.gloss{display:grid;gap:8px;max-height:34vh;overflow:auto}
.gitem{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#FDFBF7}
.gitem b{font-size:14.5px;font-weight:650}
.gitem i{font-style:normal;font-size:12.5px;color:var(--accent);background:var(--accent-soft);
  border-radius:6px;padding:2px 7px;margin-left:8px}
.gitem span{display:block;color:var(--muted);font-size:12.8px;line-height:1.6;margin-top:6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (max-width:600px){
  .wrap{padding:30px 18px 130px}
  .stages{flex-direction:column;gap:16px}
  .stage::before{display:none} .stage{padding-right:0}
  .quiz{padding:22px 20px;border-radius:18px} .qsent{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pagenav{display:flex;gap:4px;background:#F1E8DB;border-radius:12px;padding:4px;margin-bottom:26px;
  width:fit-content;max-width:100%;overflow:auto}
.pagenav a{text-decoration:none;color:var(--muted);font-size:13.5px;font-weight:550;padding:8px 16px;
  border-radius:9px;white-space:nowrap;transition:all .22s var(--ease)}
.pagenav a:hover{color:var(--ink)}
.pagenav a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(94,74,52,.12)}
.mem{margin-top:13px;background:var(--accent-soft);border-radius:11px;padding:11px 13px;
  font-size:13px;color:#2C563F;line-height:1.6}
.mem b{display:block;font-size:11px;letter-spacing:.06em;color:var(--accent);margin-bottom:4px;
  font-weight:700}
.plist{display:grid;gap:14px;margin-top:8px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;
  box-shadow:var(--shadow);cursor:pointer;transition:all .28s var(--ease);animation:rise .45s var(--ease) both}
.pcard:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.pcard h3{font-size:16.5px;font-weight:650;letter-spacing:-.015em}
.pcard .pm{font-size:12.5px;color:var(--faint);margin-top:4px}
.pcard .pv{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.6}
.pcard .tag{display:inline-block;font-size:11.5px;font-weight:650;color:var(--accent);
  background:var(--accent-soft);border-radius:6px;padding:3px 9px;margin-top:12px}
.startbig{border:0;background:var(--accent);color:#FFFCF8;border-radius:13px;font:inherit;font-size:14.5px;
  font-weight:600;padding:13px 24px;cursor:pointer;margin-top:22px;
  box-shadow:0 6px 20px rgba(63,107,85,.24);transition:all .25s var(--ease)}
.startbig:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(63,107,85,.30)}

.dochead{display:flex;justify-content:flex-end;margin:8px 0 -4px}
.dochead button{border:1px solid var(--line);background:var(--card);border-radius:9px;font:inherit;
  font-size:12.5px;font-weight:550;color:var(--muted);padding:5px 11px;cursor:pointer;
  transition:all .2s var(--ease)}
.dochead button:hover{color:var(--ink);border-color:#DFD2C0}
.quiz.docexp .docwrap,.quiz.docexp .passage{max-height:none}

.cd{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;
  box-shadow:var(--shadow);margin-bottom:20px;display:flex;gap:34px;flex-wrap:wrap;align-items:center}
.cd .big{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--accent)}
.cd .lbl{font-size:12.5px;color:var(--faint);margin-top:6px}
.cd .col b{display:block;font-size:21px;font-weight:650;letter-spacing:-.02em}
.bararea{flex:1;min-width:200px}
.bararea .t{height:8px;background:#F1E8DB;border-radius:99px;overflow:hidden}
.bararea .t i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s var(--ease)}
.bararea .cap{font-size:12.5px;color:var(--muted);margin-top:8px}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:26px 0}
.ph{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;
  box-shadow:var(--shadow);transition:all .28s var(--ease)}
.ph:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.ph.now{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--card) 60%)}
.ph h3{font-size:15.5px;font-weight:650;letter-spacing:-.015em}
.ph .rg{font-size:12px;color:var(--faint);margin-top:3px}
.ph p{font-size:13.2px;color:var(--muted);line-height:1.65;margin-top:10px}
.ph .goal{display:inline-block;font-size:12px;font-weight:650;color:var(--accent);
  background:var(--accent-soft);border-radius:7px;padding:4px 10px;margin-top:12px}
.sect{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);
  font-weight:650;margin:34px 0 14px}
.wk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;
  box-shadow:var(--shadow);overflow:hidden;transition:all .28s var(--ease)}
.wk.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.wk.done{opacity:.62}
.wkhead{display:flex;align-items:center;gap:13px;padding:17px 20px;cursor:pointer;
  border:0;background:transparent;font:inherit;width:100%;text-align:left}
.wkno{flex:none;width:38px;height:38px;border-radius:11px;background:#F4ECE1;color:var(--muted);
  display:grid;place-items:center;font-size:13px;font-weight:700}
.wk.now .wkno{background:var(--accent);color:#FFFCF8}
.wkhead h3{font-size:15.5px;font-weight:650;letter-spacing:-.015em}
.wkhead .rg{font-size:12px;color:var(--faint);margin-top:2px}
.badge{font-size:11px;font-weight:650;padding:3px 9px;border-radius:6px;flex:none;
  background:var(--warn-soft);color:var(--warn);margin-left:auto}
.badge.now{background:var(--accent-soft);color:var(--accent)}
.wkbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease)}
.wk.open .wkbody{grid-template-rows:1fr}
.wkbody>div{overflow:hidden}
.wkinner{padding:0 20px 20px;border-top:1px solid var(--line);padding-top:16px}
.wkinner .focus{font-size:13.5px;color:var(--muted);line-height:1.7;margin-bottom:14px}
.task{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:11px;
  cursor:pointer;transition:background .2s var(--ease)}
.task:hover{background:#FAF5EE}
.box{flex:none;width:20px;height:20px;border-radius:6px;border:1.8px solid #D8CCBC;margin-top:2px;
  display:grid;place-items:center;transition:all .2s var(--ease)}
.task.on .box{background:var(--accent);border-color:var(--accent)}
.task.on .box::after{content:"";width:5px;height:9px;border:solid #FFFCF8;border-width:0 2px 2px 0;
  transform:rotate(45deg) translate(-1px,-1px)}
.task span{font-size:14px;line-height:1.6}
.task.on span{color:var(--faint);text-decoration:line-through}
.wkprog{font-size:12px;color:var(--faint);margin-top:10px;padding-left:12px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.ic{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:19px 21px;
  box-shadow:var(--shadow)}

PART7[1]={k:"single",title:"單篇閱讀 · 3 題",docs:[
{t:"Riverton Manufacturing Revises Supplier Terms",m:"Industry Weekly｜Business section",p:[
["Riverton Manufacturing announced last week that it has amended its long-standing agreement with Calder Components, its principal supplier of precision parts.","Under the revised terms, Calder must now deliver all orders within twenty-one days rather than thirty.","In exchange, Riverton has agreed to waive the penalty it had previously imposed for shipments arriving after the agreed date."],
["The change follows a difficult year for Riverton, whose assembly lines stood idle for nearly three weeks last autumn after a shipment of housings failed inspection.","Company president Dana Ochoa described the shutdown as the most expensive disruption in the firm's history, though she declined to give a figure.","Analysts place the losses at close to four million dollars."],
["Not everyone has welcomed the new arrangement.","Calder's own suppliers, many of them small workshops in the region, say the tighter schedule will be passed down to them without any corresponding increase in price.","One workshop owner, who asked not to be named, said his firm would likely stop bidding on Calder contracts altogether."]]}],
qs:[
{q:"What did Riverton give up under the revised agreement?",o:["Its right to charge a fee for late shipments","A discount on precision parts","Its claim for last autumn's losses","Exclusive use of Calder's factory"],a:0,ev:[[0,0,2]],
 k:"第一段最後一句：Riverton 同意 waive（放棄）它原本對延遲到貨所課的罰款。waive 就是 Day 1 學過的字。"},
{q:"What most likely motivated Riverton to demand faster delivery?",o:["A costly production stoppage the previous year","A rise in the price of housings","New government inspection rules","The loss of its largest customer"],a:0,ev:[[0,1,0]],
 k:"推論題。第二段說產線因一批不合格零件停擺近三週，這是要求縮短交期最直接的動機。文章沒有明說「因此」，要自己把兩段連起來。"},
{q:"What is suggested about Calder's smaller suppliers?",o:["Some may stop competing for Calder's business","They have already raised their prices","They will be paid in installments","They intend to merge with Calder"],a:0,ev:[[0,2,2]],
 k:"最後一句某工廠老闆說可能不再投標，這是「暗示」而非陳述事實，選項用 some may 保留程度最貼近原文。"}]};

PART7[2]={k:"multi",title:"雙篇閱讀 · 5 題",docs:[
{t:"Job Posting #LC-114",m:"Meridian Freight｜Careers",p:[

["Applicants must have at least four years of experience in freight operations and be willing to travel abroad twice a quarter.","A degree in supply chain management is preferred but not required.","Fluency in Mandarin and English is mandatory; a third language is considered an asset."],

["I am writing to apply for the logistics coordinator position advertised on your website.","For the past six years I have managed inbound freight for a regional distributor, where I reduced reporting errors by nearly a third."],
["Although my degree is in accounting rather than supply chain management, my daily work has centred on reconciling warehouse counts against invoices.","I also speak Japanese, which I understand may be useful for your Osaka accounts.","I should mention that I am unable to travel outside Taiwan until March, when my current contract ends."],
["My references are attached, and I would welcome the chance to discuss the role."]]}],
qs:[
{q:"What is one responsibility of the advertised position?",o:["Reconciling records with physical stock","Negotiating contracts with carriers","Supervising the Osaka office","Preparing the company's annual audit"],a:0,ev:[[0,0,1]],

{q:"What are applicants asked to send?",o:["A résumé and two references","A portfolio and a cover letter","A degree certificate","A list of previous clients"],a:0,ev:[[0,2,0]],
 k:"細節題，答案在廣告最後一段第一句。這種題不要靠印象，一定回原文找。"},
{q:"What does Ms. Brandt acknowledge about her background?",o:["Her degree is not in the preferred field","She has less than four years of experience","She has never worked with warehouses","She does not speak English fluently"],a:0,ev:[[1,1,0]],

{q:"Which requirement is Ms. Brandt currently unable to meet?",o:["The travel requirement","The language requirement","The experience requirement","The reference requirement"],a:0,ev:[[0,1,0],[1,1,2]],
 k:"跨篇題——這是 Part 7 拉開分數的關鍵題型。廣告要求每季出國兩次，而她表示三月前無法出國，兩份文件對照才看得出來。"},
{q:"What can be inferred about Ms. Brandt's Japanese?",o:["It goes beyond what the job requires","It is required for the Osaka accounts","It compensates for her lack of English","It was learned during her current job"],a:0,ev:[[0,1,2],[1,1,1]],
 k:"廣告說第三語言是 an asset（加分項）而非必要；她會日文因此屬於超出要求。選項 B 把加分誤讀成必要條件，是典型陷阱。"}]};

1:[{w:"long-standing",z:"adj. 長期存在的",n:"a long-standing agreement／relationship，商業文章描述合作關係的固定用字。"},
{w:"principal",z:"adj. 主要的",n:"principal supplier ＝ 主要供應商。與 principle（原則，名詞）發音相同但詞性、意思都不同，Part 5 常拿來設陷阱。"},
{w:"stand idle",z:"閒置、停擺不運轉",n:"The assembly lines stood idle. 描述產線停工的道地說法，比 stop working 高階。"},
{w:"decline to + 原形",z:"婉拒（做某事）",n:"she declined to give a figure ＝ 她不願提供數字。這裡不是「下降」，這個雙義是閱讀常見誤讀點。"},
{w:"place the losses at",z:"估計損失為…",n:"place／put A at B ＝ 把 A 估計為 B。與 estimate A at B 同義，財經文章高頻。"},
{w:"pass down to",z:"轉嫁給（下游）",n:"the schedule will be passed down to them ＝ 壓力轉嫁到下游廠商身上。"},
{w:"corresponding",z:"adj. 相應的、對應的",n:"without any corresponding increase in price ＝ 價格卻沒有相應調漲。Part 6 也常考。"},
{w:"bid on / for",z:"投標爭取",n:"stop bidding on contracts ＝ 不再投標。bid 三態同形，別寫成 bidded。"}],
2:[{w:"the successful candidate",z:"錄取者",n:"徵才廣告的固定說法，指「最後獲選的人」，不是「成功的候選人」。看到它就知道下文在描述工作內容。"},
{w:"be willing to + 原形",z:"願意…",n:"be willing to travel abroad。徵才條件句的高頻結構。"},
{w:"twice a quarter",z:"每季兩次",n:"頻率表達：once a week／twice a month／three times a year。這種數字條件常成為跨篇比對的關鍵。"},
{w:"an asset",z:"加分條件、有價值的特質",n:"is considered an asset ＝ 屬加分項，非必要條件。與 mandatory（必要）形成對比，是本篇最容易誤判的地方。"},
{w:"inbound / outbound",z:"進貨的／出貨的",n:"inbound freight ＝ 進貨運輸。物流題常成對出現。"},
{w:"by + 幅度",z:"表示增減的幅度",n:"reduced errors by nearly a third ＝ 減少了將近三分之一。by 後面接的是「差額」，不是最終值——圖表題必考。"},
{w:"centre / center on",z:"聚焦於、以…為核心",n:"my work has centred on reconciling counts ＝ 我的工作核心是核對數量。"},
{w:"reconcile A against / with B",z:"核對、使相符",n:"會計與倉儲場景的專業動詞，與 Day 5 的 discrepancy 是一組。"}],
3:[{w:"be fitted with",z:"裝設有…",n:"The east wing has been fitted with a card-access system. 描述建物設備的固定被動用法。"},
{w:"be issued a card",z:"被核發（證件、卡片）",n:"issue sb sth 是雙受詞動詞，被動時人當主詞。公告題高頻。"},
{w:"on sb's behalf",z:"代表某人、替某人",n:"retrieve documents on their behalf ＝ 替他們取件。也可說 on behalf of sb。"},
{w:"retrieve",z:"v. 取回、調閱",n:"比 get 正式，用於文件、資料、行李。"},
{w:"accordingly",z:"adv. 據此、相應地",n:"update their calendars accordingly ＝ 據此更新行事曆。放句尾，是公告結尾的常見副詞。"},
{w:"normally be handled",z:"通常會被處理",n:"normally／typically 這類副詞是「原則性說明」的訊號，題目常拿來考「是否為絕對規定」。"}],
4:[{w:"beforehand",z:"adv. 事先、提前",n:"you will not be able to check in beforehand。＝ in advance，但更口語，常出現在行程說明。"},
{w:"carry-on",z:"n. 隨身行李",n:"與 checked baggage（託運行李）相對。旅行題必備的一組對照。"},
{w:"for an additional fee",z:"需額外付費",n:"飯店與航空公司公告的關鍵片語，題目最愛問「哪一項要另外收費」。"},
{w:"at no charge",z:"免費",n:"＝ free of charge、complimentary。三種說法同義，換句話說就是考點。"},
{w:"be scheduled for + 時間",z:"排定於…",n:"Your presentation is scheduled for 1:30 p.m. 注意介系詞是 for，不是 at。"},
{w:"complimentary vs complementary",z:"免費招待的／互補的",n:"只差一個字母，意思完全不同。ETS 每年都考，看到務必放慢。"}],
5:[{w:"fall by half",z:"減少一半",n:"by 表示幅度。fall by half（減少一半）vs fall to half（降到剩一半），差一個介系詞結果差很多。"},
{w:"closer to",z:"更接近於…",n:"The reduction has been closer to seventy percent. 用來修正前面提到的預期值，是本篇第一題的答題關鍵。"},
{w:"adopt",z:"v. 採用（標準、政策）",n:"adopt a standard／policy。別跟 adapt（調整、適應）混，這組是 Part 5 經典陷阱。"},
{w:"struggle with",z:"難以負擔、應付吃力",n:"smaller suppliers would struggle with the cost ＝ 小廠商會吃不消成本。"},
{w:"have no plans to + 原形",z:"沒有打算…",n:"比 will not 委婉，公司聲明常用。題目常拿它考「是否會強制實施」。"},
{w:"in other words",z:"換句話說",n:"看到它就知道下一句是前一句的改寫——通常也是答案句所在。"}],
6:[{w:"come in ahead of",z:"優於（預期、預測）",n:"came in slightly ahead of our forecast ＝ 略優於我們的預測。財經報告固定說法。"},
{w:"ease",z:"v.（價格、壓力）趨緩下降",n:"We had expected freight costs to ease ＝ 我們原本預期運費會回落。這裡不是「容易」。"},
{w:"rest on",z:"建立在…之上、取決於",n:"confidence rests on an assumption ＝ 信心建立在某個假設上。用來指出論點的前提。"},
{w:"attribute A to B",z:"把 A 歸因於 B",n:"The company attributed the gap to higher costs. 被動 be attributed to 也很常見。"},
{w:"read / view A as B",z:"將 A 解讀為 B",n:"read the dividend as a signal of confidence。考的是觀點題，注意誰在解讀。"},
{w:"rather than",z:"而非",n:"a signal of confidence rather than caution。rather than 後面是被否定的那一邊，讀太快很容易看反方向。"},
{w:"leave ... unchanged",z:"維持…不變",n:"leaving our revenue estimate unchanged。與前半句的 lowering 形成對比，是第三題的陷阱來源。"}],
7:[{w:"replace A with B",z:"以 B 取代 A",n:"replaced punch cards with an app。介系詞是 with；若用 substitute 則是 substitute B for A，方向相反。"},
{w:"redemption rate",z:"（點數）兌換率",n:"動詞 redeem。行銷與會員方案文章的核心指標。"},
{w:"exceed every internal forecast",z:"超出所有內部預測",n:"exceed 是及物動詞，後面不加介系詞。"},
{w:"in effect",z:"實際上、等於是",n:"The rewards, in effect, had become invisible. 用來下總結，常是主旨題的答案句。注意與 in effect（生效中）的另一義區分，看逗號位置。"},
{w:"yet",z:"conj. 然而",n:"Sign-ups exceeded forecasts, yet redemption rates fell. 轉折詞就是答案的分界線，畫線標記它。"},
{w:"closest to being earned",z:"最接近可以達成的",n:"形容詞最高級 + to + V-ing。指「差一點就能兌換的那個獎勵」。"}],
8:[{w:"be carried out",z:"被執行、進行",n:"No work will be carried out at weekends. ＝ conduct、perform 的被動說法，公告題高頻。"},
{w:"in advance",z:"事先",n:"at least three working days in advance ＝ 至少提前三個工作天。注意 working days（工作天）不含週末，這是本篇的細節陷阱。"},
{w:"be reserved for",z:"保留給（特定對象）",n:"The freight elevator will be reserved for contractors. 第五題的答題關鍵就在這一句。"},
{w:"on a recurring basis",z:"定期地、經常性地",n:"與 case by case（逐案處理）形成對比，這正是租戶信件的訴求重點。"},
{w:"case by case",z:"逐案、個案處理",n:"也寫作 on a case-by-case basis（當形容詞時加連字號）。"},
{w:"run through + 時間",z:"持續到…",n:"Our bookings run through the end of June ＝ 我們的預約排到六月底。"}]};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const START="2026-08-01", DAY_MS=864e5;
function dayNumber(){const s=new Date(START+"T00:00:00"),n=new Date();
  const t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.floor((t-s)/DAY_MS)+1}
const realDay=dayNumber(), homeDay=Math.min(Math.max(realDay,1),DAYS.length);
let viewDay=homeDay;
function chrome(){
  const day=DAYS[viewDay-1];
  $("#eyebrow").textContent=`Day ${String(viewDay).padStart(2,"0")}`;
  $("#theme").textContent=day.theme;
  $("#story").textContent=day.story;
  $("#prev").disabled=viewDay<=1; $("#next").disabled=viewDay>=DAYS.length;
  $("#backToday").style.display=viewDay===homeDay?"none":"inline-block";
  const d=new Date(); $("#dateLabel").textContent=`今天是 ${d.getMonth()+1}/${d.getDate()}`;
  $("#jump").value=viewDay;
}
function go(n){viewDay=n;load();scrollTo({top:0,behavior:"smooth"})}
$("#prev").onclick=()=>go(viewDay-1);
$("#next").onclick=()=>go(viewDay+1);
$("#backToday").onclick=()=>go(homeDay);
$("#jump").innerHTML=DAYS.map(d=>`<option value="${d.n}">Day ${String(d.n).padStart(2,"0")} · ${d.theme}</option>`).join("");
$("#jump").onchange=e=>go(+e.target.value);
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;");

let R7=null,ri=0,r7done=false,r7ans=[],docExp=false;
function load(){
  chrome();
  const d=PART7[viewDay];
  $("#eyebrow").textContent=`Day ${String(viewDay).padStart(2,"0")} · Part 7 閱讀`;
  $("#story").textContent="作答後原文會自動標出答案依據。全部答完可看到整篇標示與難字片語表。";
  $("#plist").innerHTML=d?d.docs.map(doc=>`
    <article class="pcard" data-go="1"><h3>${doc.t}</h3><div class="pm">${doc.m}</div>
      <div class="pv">${esc(doc.p[0][0])}…</div>
      <span class="tag">${d.k==="single"?"單篇":"雙篇之一"}</span></article>`).join(""):"";
  $("#startRead").textContent=d?`開始閱讀 · ${d.qs.length} 題 ›`:"";
  $("#startRead").style.display=d?"inline-block":"none";
  $("#endNotice").innerHTML=d?"":`<div class="notice">這一天還沒有 Part 7 閱讀。</div>`;
}
function startP7(){const d=PART7[viewDay];if(!d)return;R7=d;ri=0;r7ans=[];
  $("#quiz").classList.add("reading");$("#overlay").classList.add("on");drawP7()}
function docsHTML(ev){return R7.docs.map((d,di)=>
  `<div class="doc"><h4>${d.t}</h4><div class="pmeta">${d.m}</div>`+
  d.p.map((para,pj)=>`<p>${para.map((s,si)=>{
    const on=ev&&ev.some(e=>e[0]===di&&e[1]===pj&&e[2]===si);
    return `<span class="sn${on?" ev":""}" id="s${di}-${pj}-${si}">${s}</span>`}).join(" ")}</p>`).join("")+`</div>`).join("")}
function drawP7(){r7done=false;const q=R7.qs[ri];
  $("#quiz").innerHTML=`<div class="qtop"><span>${R7.title}　·　第 ${ri+1} / ${R7.qs.length} 題</span>
   <div class="track"><i style="width:${ri/R7.qs.length*100}%"></i></div><button class="link" id="close">結束</button></div>
   <div class="dochead"><button id="expandDoc">${docExp?"⤡ 收合全文":"⤢ 展開全文"}</button></div>
   <div class="docwrap" id="docwrap">${docsHTML(null)}</div>
   <p class="qtext">${q.q}</p>
   <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><kbd>${k+1}</kbd>${o}</button>`).join("")}</div>
   <div class="feedback" id="fb"></div><div class="qfoot" id="foot"></div>`;
  $("#quiz").classList.toggle("docexp",docExp)}
function pick7(k){if(r7done)return;r7done=true;
  const q=R7.qs[ri],ok=k===q.a;r7ans.push({q,ok});
  $$(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.k===q.a)b.classList.add("right");
    else if(+b.dataset.k===k)b.classList.add("wrong")});
  $("#docwrap").innerHTML=docsHTML(q.ev);
  const dw=$("#docwrap"),f=document.getElementById(`s${q.ev[0][0]}-${q.ev[0][1]}-${q.ev[0][2]}`);
  if(dw&&f)dw.scrollTo({top:f.offsetTop-dw.clientHeight/2+f.offsetHeight/2,behavior:"smooth"});
  $("#fb").className="feedback on";
  $("#fb").innerHTML=`<div><b>${ok?"✓ 正確":"✗ 正解："+q.o[q.a]}</b></div><div class="zh">${q.k}</div>
    <div class="evnote">答案依據已在原文中標示${q.ev.length>1?`（共 ${q.ev.length} 處，需跨段落／跨文件對照）`:""}</div>`;
  $("#foot").innerHTML=`<button class="primary" id="next2">${ri+1<R7.qs.length?"下一題 ›":"看結果"}</button><span class="qhint">按 Enter 繼續</span>`
  requestAnimationFrame(()=>{const q=$("#quiz");if(q)q.scrollTo({top:q.scrollHeight,behavior:"smooth"})});}
function nextP7(){if(ri<R7.qs.length-1){ri++;drawP7()}else endP7()}
function endP7(){const right=r7ans.filter(x=>x.ok).length,total=R7.qs.length,r=right/total;
  const allEv=R7.qs.flatMap(q=>q.ev),gl=GLOSS[viewDay]||[];
  $("#quiz").innerHTML=`<div class="qtop"><span>Day ${viewDay} · Part 7 結果</span><div class="track"><i style="width:100%"></i></div></div>
   <div class="score">${right}<span style="font-size:22px;color:#A79C90"> / ${total}</span></div>
   <p class="qhint">${r>=.9?"閱讀定位很準，這個水準已經接近滿分區。":r>=.6?"大方向對了，把錯的題目回原文重讀標示的句子。":"Part 7 錯多半是「沒回原文找」。下面全文已標出所有依據，逐句對照一次。"}</p>
   <p class="evnote">以下全文已標出全部 ${allEv.length} 處答案依據</p>
   <div class="docwrap" style="max-height:40vh">${docsHTML(allEv)}</div>
   <div class="wronglist">${r7ans.map((x,i)=>`<div class="wrongitem">${x.ok?"✓":"✗"} 第 ${i+1} 題　<b>${x.q.o[x.q.a]}</b><span>${x.q.k}</span></div>`).join("")}</div>
   ${gl.length?`<div class="glosshead">本篇難字與常考片語　<span>${gl.length} 則</span></div>
   <div class="gloss">${gl.map(g=>`<div class="gitem"><b>${g.w}</b><i>${g.z}</i><span>${g.n}</span></div>`).join("")}</div>`:""}
   <div class="qfoot"><button class="primary" id="again7">再讀一次</button><button class="link" id="close">回到列表</button></div>`}
$("#startRead").onclick=startP7;
$("#plist").addEventListener("click",e=>{if(e.target.closest(".pcard"))startP7()});
$("#quiz").addEventListener("click",e=>{
  if(e.target.closest("#close"))return $("#overlay").classList.remove("on");
  if(e.target.closest("#again7"))return startP7();
  const ed=e.target.closest("#expandDoc");
  if(ed){docExp=!docExp;$("#quiz").classList.toggle("docexp",docExp);
    ed.textContent=docExp?"⤡ 收合全文":"⤢ 展開全文";return}
  if(e.target.closest("#next2"))return nextP7();
  const o=e.target.closest(".opt");if(o)pick7(+o.dataset.k)});
$("#overlay").addEventListener("click",e=>{if(e.target===$("#overlay"))$("#overlay").classList.remove("on")});
document.addEventListener("keydown",e=>{
  if(!$("#overlay").classList.contains("on"))return;
  if(e.key==="Escape")return $("#overlay").classList.remove("on");
  if(!r7done&&/^[1-4]$/.test(e.key)){const b=$$(".opt")[+e.key-1];if(b)pick7(+b.dataset.k)}
  else if(r7done&&(e.key==="Enter"||e.key===" ")){e.preventDefault();const n=$("#next2")||$("#again7");n&&n.click()}});
load();

</script>
</body>
</html>
